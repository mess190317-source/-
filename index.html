<body>
<style>
/* App shell: sticky top bar (back / title / help), bottom tab bar, fixed action bar in focus screens */
:root{
  --paper:#F2F4F8; --card:#FFFFFF; --ink:#1B2130; --sub:#596278; --line:#D8DDE7;
  --accent:#2C4A9A; --accent-ink:#FFFFFF; --accent-soft:#E6EBF7;
  --ok:#1E7A4C; --ok-soft:#E2F2E9; --ng:#C23B22; --ng-soft:#FBE7E2;
  --sheet:#E2483A; --code-bg:#EDF0F6; --shadow:0 1px 2px rgba(27,33,48,.06),0 4px 14px rgba(27,33,48,.05);
  --scrim:rgba(14,18,28,.48);
  --f-ui:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --f-code:"BIZ UDGothic","Consolas","Menlo","MS Gothic",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141B; --card:#191E29; --ink:#E5E8EF; --sub:#9BA3B7; --line:#2B3243;
  --accent:#93AAF0; --accent-ink:#0D1120; --accent-soft:#222B44;
  --ok:#5CC48C; --ok-soft:#163124; --ng:#F17D65; --ng-soft:#3A1D17;
  --sheet:#C8473B; --code-bg:#141925; --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141B; --card:#191E29; --ink:#E5E8EF; --sub:#9BA3B7; --line:#2B3243;
  --accent:#93AAF0; --accent-ink:#0D1120; --accent-soft:#222B44;
  --ok:#5CC48C; --ok-soft:#163124; --ng:#F17D65; --ng-soft:#3A1D17;
  --sheet:#C8473B; --code-bg:#141925; --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:grid;grid-template-columns:84px minmax(0,1fr) 84px;align-items:center;height:52px}
.rbtns{display:flex;justify-content:flex-end;gap:2px}
.lbtns{display:flex;justify-content:flex-start}
.lbtns .iconbtn[hidden]{display:none!important}
#bell{position:relative}
.badge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--ng);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1;border:2px solid var(--card)}
.badge[hidden]{display:none!important}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);z-index:15;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);width:max-content;max-width:calc(100% - 32px);transition:opacity .3s}
.toast button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.toast.hide{opacity:0;pointer-events:none}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.news>li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.news>li.new{border-color:var(--accent);background:var(--accent-soft)}
.news .nh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.news .nd{font-size:12px;color:var(--sub);font-weight:700}
.news .nt{font-weight:700;font-size:15px}
.news ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.7}
#snd[aria-pressed="false"]{color:var(--sub)}
.ttl{text-align:center;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--accent)}
.iconbtn:hover{background:var(--accent-soft)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[hidden]{visibility:hidden;display:grid!important}
/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 6px;font-size:11px;font-weight:700;color:var(--sub)}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}
body[data-view="quiz"] .tabs,body[data-view="note"] .tabs,body[data-view="guide"] .tabs,body[data-view="setup"] .tabs{display:none}
/* fixed action bar */
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.actbar .wrap{display:flex;gap:8px;align-items:center;min-height:44px}
.actbar .grow{flex:1}
.actbar .note{flex:1;text-align:center;color:var(--sub);font-size:13px}
main>.wrap{padding-block:18px 108px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.4}
h1{font-size:22px}
h2{font-size:17px}
p{margin:0}
.muted{color:var(--sub)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:10px;font-weight:700;font-size:15px;line-height:1.4;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.big{width:100%;padding:14px 16px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.label{font-size:12px;letter-spacing:.06em;color:var(--sub);font-weight:700}
.sec-t{font-size:13px;color:var(--sub);font-weight:700;margin:6px 2px -6px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ng{background:var(--ng-soft);color:var(--ng)}
.pill.plain{background:var(--code-bg);color:var(--sub)}
.hint{font-size:13px;color:var(--sub);background:var(--code-bg);border-radius:8px;padding:8px 12px;line-height:1.6}
.bar2{height:8px;border-radius:4px;background:var(--code-bg);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar2.ok i{background:var(--ok)}
/* step dots */
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.dots.big i{width:8px;height:8px}
.dots.big i.on{background:var(--accent);width:22px;border-radius:4px}
/* next-up card */
.next{display:flex;flex-direction:column;gap:12px;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.next .where{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.next .stepname{font-size:20px;font-weight:700;line-height:1.35}
/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:12px;color:var(--sub);line-height:1.4}
/* list rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.nrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 14px;min-height:60px}
.nrow:first-child{border-top:0}
.nrow:hover{background:var(--accent-soft)}
.nrow:disabled{opacity:.5;cursor:default;background:transparent}
.nrow .ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px}
.nrow .ic svg{width:22px;height:22px}
.nrow .ic.done{background:var(--ok);color:#fff}
.nrow .tx{display:flex;flex-direction:column;min-width:0;line-height:1.45}
.nrow .tx b{font-size:15px}
.nrow .tx span{font-size:12.5px;color:var(--sub)}
.nrow .chev{color:var(--sub);font-size:20px;line-height:1}
.nrow .meta{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12px}
/* lesson steps */
.phead{display:flex;flex-direction:column;gap:6px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.step .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--code-bg);color:var(--sub)}
.step.done .n{background:var(--ok);color:#fff}
.step.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.step.cur .n{background:var(--accent);color:var(--accent-ink)}
.step .bd{display:flex;flex-direction:column;gap:8px;min-width:0}
.step .bd h3{font-size:16px}
.step .bd p{font-size:13px;color:var(--sub);line-height:1.6}
.gslide{display:flex;flex-direction:column;gap:14px}
.gslide h2{font-size:20px}
.gslide p{line-height:1.85}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tcap{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.dt{border-collapse:collapse;font-family:var(--f-code);font-size:13px;min-width:100%}
.dt th,.dt td{border:1px solid var(--line);padding:5px 9px;text-align:left;white-space:nowrap}
.dt th{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nul{color:var(--sub);font-style:italic;font-size:12px}
.pre{display:flex;flex-direction:column;gap:10px;padding:14px}
.pre .list{box-shadow:none}
/* grammar */
.ordercard{display:flex;flex-direction:column;gap:12px}
.ptabs{gap:6px}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:o}
.ob{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1.5px dashed var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
.ob.req{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.ob:hover{border-color:var(--accent)}
.ob .oi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--code-bg);color:var(--sub)}
.ob.req .oi{background:var(--accent);color:var(--accent-ink)}
.ob .ot{display:flex;flex-direction:column;min-width:0;gap:2px}
.ob code{background:transparent;padding:0;font-size:15px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.ob .oy{font-size:12px;color:var(--sub);line-height:1.5}
.ob .oy b{color:var(--accent)}
.ob .ex{font-size:11px;font-weight:700;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:0 7px;white-space:nowrap;background:var(--card)}
.gi{border-top:1px solid var(--line);scroll-margin-top:64px}
.gi:first-child{border-top:0}
.gi summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 40px 12px 14px;position:relative}
.gi summary::-webkit-details-marker{display:none}
.gi summary::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:20px;transition:transform .2s}
.gi[open] summary::after{transform:translateY(-50%) rotate(90deg)}
.gi summary:hover{background:var(--accent-soft)}
.gw{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gw code{background:transparent;padding:0;font-size:16px;font-weight:700;color:var(--accent)}
.gy{font-size:12px;color:var(--sub);font-weight:700}
.gm{font-size:14px}
.gb{display:flex;flex-direction:column;gap:10px;padding:0 14px 16px}
.gb .label{display:block;margin-bottom:4px}
.exd{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--accent);padding-left:12px}
.exj{font-weight:700;line-height:1.7}
.exj .label{display:block;margin-bottom:2px}
.exp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exp li{display:flex;flex-direction:column;gap:2px}
.exp code{align-self:flex-start;font-size:13px;overflow-wrap:anywhere}
.exp span{font-size:14px;color:var(--sub);line-height:1.6;padding-left:2px}
.exp span::before{content:"→ ";color:var(--accent);font-weight:700}
/* splash / update loading */
#splash{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,#1A2F6E,#2C4A9A);color:#fff;display:grid;place-items:center;transition:opacity .35s ease}
#splash.hide{opacity:0;pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:18px;font-family:var(--f-ui)}
.sp-logo{display:flex;flex-direction:column;align-items:center;line-height:1;font-weight:700;font-size:56px;letter-spacing:-.01em}
.sp-logo span{font-size:24px;color:#FFD45C;margin-top:6px}
.sp-spin{width:34px;height:34px;border-radius:50%;border:3.5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite}
.sp-msg{font-size:14px;font-weight:700;color:#DCE4FA;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp-spin{animation-duration:2.4s}}
.qex{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.qex .qtag{align-self:flex-start;font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 10px}
.qex p{font-weight:700;font-size:15px;line-height:1.7}
.form{border-top:1px dashed var(--line);padding-top:10px}
/* 文節改行：<wbr> の位置だけで改行し、入りきらない長い言葉だけ途中で折る */
.bx body{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
.bx pre.code,.bx code,.bx textarea,.bx input{word-break:normal}
/* ranking */
.rank{display:flex;flex-direction:column;gap:10px}
.rk-head{display:flex;align-items:baseline;gap:6px;font-weight:700;font-size:18px}
.rk-big{font-size:48px;line-height:1;color:var(--accent)}
.rk-gap{font-size:15px;line-height:1.7}
.rk-gap b{color:var(--accent)}
.rk-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rk-list li{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.rk-list li:first-child{border-top:0}
.rk-list li.me{background:var(--accent-soft);font-weight:700}
.rk-l{font-size:12px;color:var(--sub);font-weight:700}
.rk-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-s{font-weight:700}
.rankmini{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.rankmini:hover{border-color:var(--accent)}
.rankmini .rk-pos{font-weight:700;white-space:nowrap}
.rankmini .rk-big{font-size:26px}
.rankmini .rk-sub{font-size:13px;color:var(--sub)}
.rankmini .rk-sub b{color:var(--accent)}
.rankmini .chev{color:var(--sub);font-size:20px}
/* why (間違えたところ) */
.why{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.why .label{display:block}
.why .pick{border:1.5px solid var(--ng);background:var(--ng-soft);border-radius:8px;padding:8px 10px;line-height:1.6}
.why-r{font-size:14px;line-height:1.7}
.why-x{margin-top:6px;padding-top:6px;border-top:1px dashed var(--ng);font-size:14px;line-height:1.7;color:var(--ink)}
.why-x b{color:var(--ng);margin-right:6px}
.why-h{margin:0;padding-left:1.2em;font-size:14px;line-height:1.7;display:flex;flex-direction:column;gap:4px}
.cmp{display:flex;flex-direction:column;gap:8px}
.cmp>div{display:flex;flex-direction:column;gap:2px}
.code.tk{font-family:var(--f-code);font-size:14px;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}
code.wd{font-size:15px;padding:3px 8px;align-self:flex-start;letter-spacing:.02em}
mark.ex{background:var(--ng-soft);color:var(--ng);border:1px solid var(--ng);border-radius:4px;padding:0 3px;text-decoration:line-through;text-decoration-thickness:1px}
mark.ms{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 3px;font-weight:700}
.why mark{font-family:inherit}
.gsheet{max-width:640px;padding-top:14px;gap:10px}
.gs-head{position:sticky;top:-14px;z-index:1;background:var(--card);margin:-14px -20px 0;padding:14px 20px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.gs-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gs-tabs::-webkit-scrollbar{display:none}
.gs-tabs .chip{flex:none}
.gs-tabs .chip code{background:transparent;padding:0;font-weight:700;color:inherit}
.gs-body .gi{border:0}
.gs-body .gi summary{padding:4px 0 10px;cursor:default}

<script>
/* ===== 分野と授業回 ===== */
const CATS=[
  {id:1,name:'副問い合わせ',n:9,ls:[2,3]},
  {id:2,name:'集合演算',n:6,ls:[4]},
  {id:3,name:'DML',n:6,ls:[5]},
  {id:4,name:'トランザクション',n:3,ls:[6]},
  {id:5,name:'テーブル作成・データ型',n:8,ls:[7,8]},
  {id:6,name:'制約',n:7,ls:[9,10,11]},
  {id:7,name:'その他のオブジェクト',n:7,ls:[12,13,14,15,19]},
  {id:8,name:'ユーザー作成と権限',n:4,ls:[16,17,18]}
];
const LT={2:'単一行副問い合わせ',3:'複数行副問い合わせ',4:'集合演算',5:'データ操作言語',6:'トランザクション',7:'データベースオブジェクトと表の作成',8:'表の作成とデータ型',9:'エンティティ整合性制約の種類',10:'参照整合性制約',11:'表レベルでの制約の定義',12:'ビューの作成',13:'ビューでのデータ操作',14:'索引',15:'順序',16:'ユーザの作成',17:'権限の管理',18:'ロールの管理',19:'シノニム'};
const L2C={};CATS.forEach(c=>c.ls.forEach(l=>L2C[l]=c.id));
const KINDS={p:'シート内容チェック',r:'カルテ',s:'授業シート問題',k:'コードの単語',d:'記述'};
const CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮';

/* ===== 復習ノート（授業シートのキーポイント） ===== */
const NOTES={
2:[[`副問い合わせ（サブクエリー）とは？`,`他のSQLに埋め込まれた（ネストした）SELECT文。主問い合わせの前に一度だけ実行される`],
[`主問い合わせ／副問い合わせ`,`外側のSELECT文＝主問い合わせ、内側のSELECT文＝副問い合わせ`],
[`副問い合わせを使える場所`,`SELECT文のFROM句・WHERE句・HAVING句、INSERT文のVALUES句、UPDATE文のSET句・WHERE句、DELETE文のWHERE句など`],
[`単一行副問い合わせ`,`副問い合わせが結果を1行だけ返す　例）WHERE 列名 = (SELECT …)`],
[`複数行副問い合わせ`,`副問い合わせが結果を複数行返す（1行でもよい）　例）WHERE 列名 IN (SELECT …)`],
[`副問い合わせのガイドライン`,`( )で囲む／比較条件の右側に置く／複数行副問い合わせには複数行条件を使う`],
[`単一行条件`,`=、>、>=、<、<=、<> など`],
[`単一行条件で、副問い合わせが複数行を返すと？`,`エラーになる（「単一行副問い合わせにより2つ以上の行が戻されます」）`],
[`複数行条件で、副問い合わせが1行だけ返すと？`,`エラーにならない。わからないときは複数行条件を使う`],
[`副問い合わせが1行も返さないと？`,`NULLを返す → = NULL と同じでtrueにならず、主問い合わせは「行が選択されていません」。エラーではない`],
[`副問い合わせでグループ関数を使い、GROUP BYがないとき`,`副問い合わせは必ず1行を返す（単一行副問い合わせ）`],
[`複数列副問い合わせ`,`WHERE (job, sal) = (SELECT job, sal FROM emp …) のように複数列を一度に比べる`]],
3:[[`複数行条件`,`IN、ANY、ALL（ANY・ALLは単一行条件と組み合わせて使う。単独では使えない）`],
[`IN／NOT IN`,`IN＝戻された値のいずれかと等しい／NOT IN＝いずれとも等しくない`],
[`NOT INの結果にNULLが含まれると？`,`NOT INは比較のAND。<> NULL が1つでもあると文全体は決してtrueにならない → 0行`],
[`ANYとは`,`「どれか」。戻された値との比較をORで結んだもの`],
[`> ANY／< ANY`,`> ANY＝最小値より大きい／< ANY＝最大値より小さい`],
[`= ANY`,`INと同じ`],
[`ALLとは`,`「すべて」。戻された値との比較をANDで結んだもの`],
[`> ALL／< ALL`,`> ALL＝最大値より大きい／< ALL＝最小値より小さい`],
[`<> ALL`,`NOT INと同じ`],
[`使わないほうがよい複数行条件`,`<> ANY（何でもOKになってしまう）、= ALL（ありえない条件）`]],
4:[[`集合演算とは`,`列の数・データ型が一致している複数のSELECT文を組み合わせて、和・差・積を求める演算（複合問合せともいう）`],
[`集合演算の種類`,`UNION、UNION ALL、MINUS、INTERSECT`],
[`UNION`,`和集合：どちらかに存在するすべての行（重複は1回だけ）`],
[`UNION ALL`,`重複するデータもすべて表示する（2重に表示）`],
[`MINUS`,`差集合：左側の結果から右側の結果を取り除いた行（引かれる集合を左、引く集合を右）`],
[`INTERSECT`,`共通集合：両方に存在する行`],
[`集合演算が成立する条件`,`列の数が同じ、データ型に互換性がある（列名は違ってよい。結果の列名は1つ目のSELECT文のもの）`],
[`集合演算の自動ソート（ORDER BYなし）`,`ORDER BYがない場合、第1問合せの第1列でソート（重複を調べるため。UNION ALL以外）。UNION ALLは第1問合せの結果のあとに第2問合せ`],
[`集合演算の手動ソート（ORDER BY）`,`ORDER BY句は最後のSELECT文の文末に1度だけ。列名は1つ目のSELECT文の列名（列別名）に合わせる`],
[`Oracleにない集合演算とEXCEPT`,`商は実装されていない。補集合もない。21c以降はMINUSのかわりにEXCEPTも使える`]],
5:[[`DML（データ操作言語）の種類`,`INSERT、UPDATE、DELETE、SELECT、MERGE`],
[`INSERT文の基本構文（列名を指定する）`,`INSERT INTO 表名 (列名1, 列名2…) VALUES (値1, 値2…);`],
[`列名リストにない列に入る値`,`DEFAULT値が設定されていればその値、なければNULL`],
[`NULL値・DEFAULT値の明示的な挿入`,`VALUES (NULL, DEFAULT …)　※ 'NULL' としない`],
[`INSERT文の基本構文（列名を省略する）`,`INSERT INTO 表名 VALUES (値1, 値2…);`],
[`列名を省略したINSERT文の、値の書き方のルール`,`DESCで表示される順番どおりに、すべての列の値を指定する（列数や型が合わないとエラー）`],
[`UPDATE文`,`UPDATE 表名 SET 列名 = 値 WHERE 条件;`],
[`複数列の更新`,`SET 列1 = 値1, 列2 = 値2（カンマで区切る。ANDは×）`],
[`DELETE文`,`DELETE FROM 表名 WHERE 条件;（列名や*は書かない。行単位で削除）`],
[`WHERE句をつけないと？`,`UPDATE＝すべての行の列値が同じ値に／DELETE＝全行消える`]],
6:[[`マルチユーザー・アクセス`,`同じデータベースユーザーで複数の接続を作り、同時にアクセスできる`],
[`セッション`,`複数の接続を区別する単位。データベースに接続してから切断するまでの一連の処理`],
[`トランザクション`,`同時に確定しないと不整合が起こる、関連のあるINSERT・UPDATE・DELETEなどの処理の集まり`],
[`セッションとトランザクション`,`1つのセッションではトランザクションは1つずつ。異なるセッションでは並行して実行される`],
[`COMMIT`,`トランザクションを確定する（コミットからコミットまでが1つのトランザクション）`],
[`ROLLBACK`,`トランザクションを取り消す（前回のコミット時、またはセーブポイントまで戻る）`],
[`SAVEPOINT`,`SAVEPOINT 名前; でロールバック時に戻る位置を保存（ROLLBACK TO 名前;）。セーブポイントではトランザクションは終了しない`],
[`正常終了と暗黙のコミット`,`COMMIT・ROLLBACKの発行、DDL・DCLの実行（直前のトランザクションを暗黙的にコミット）、正常な切断`],
[`異常終了と暗黙のロールバック`,`マシン障害・ネットワーク障害・サーバーダウンなどの異常切断 → 暗黙的にロールバック`],
[`読み取り一貫性`,`SELECT文の実行中に他のユーザーがデータを変更しても、SELECT文が終わるまでは変更前のデータを参照する`],
[`ロック（テキスト）`,`変更中の行には排他ロックがかかる。SELECT … FOR UPDATE [NOWAIT | WAIT n] でも行をロックできる`]],
7:[[`データベースオブジェクト`,`表、ビュー、順序、索引、シノニムなど（スキーマオブジェクトともいう）`],
[`スキーマとは？`,`オブジェクトの持ち主。オブジェクトが属する名前空間。オブジェクトは必ずどこかのスキーマに所属する`],
[`ユーザとは？`,`権限や制限などのアクセス権を管理する単位。Oracleではユーザごとに同名のスキーマを持つ`],
[`表の作成（DDL）`,`CREATE TABLE 表名 ( 列名 データ型 [制約], 列名 データ型 [制約] … );`],
[`既定値の指定`,`DEFAULTオプション　例）loc VARCHAR2(10) DEFAULT '東京'`],
[`表の削除（DDL）`,`DROP TABLE 表名;（表定義を削除）`],
[`表を確認するコマンド`,`DESCコマンド　例）DESC emp（SQL*Plusのコマンドなので ; はいらない）`],

9:[[`制約とは？`,`不整合なデータが入らないように一定の制限をつけ、データの整合性を保つ`],

19:[[`プライベートシノニム`,`作成したユーザのみアクセスできる。作成したスキーマ内に作られ、スキーマ内でユニークな名前（表と同じ名前も不可）`],

/* ===== 問題 =====
  C(回, 出典, 問題, [選択肢…], 解説, 正解数)  … 選択肢は先頭から「正解数」個が正解（表示時にシャッフル）
  W(回, 出典, 問題, '正解|別解', 解説)        … 単語記述
  K(回, コード, 問題, '正解|別解', 解説)       … コードの穴埋め（___ が空欄）
  D(回, 問題, '模範解答|別解', 解説)           … SQL記述                                  */
const QS=[];
function add(o){o.c=L2C[o.l];let h=5381;const s=(o.k==='r'||o.k==='p'?o.k:'')+o.l+o.q+(o.code||'');for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))>>>0;o.id='q'+h.toString(36);QS.push(o)}
const C=(l,src,q,o,e,n=1)=>add({l,k:'s',t:'c',src,q,o,n,e});
const W=(l,src,q,a,e)=>add({l,k:'s',t:'w',src,q,a:a.split('|'),e});
const K=(l,code,q,a,e)=>add({l,k:'k',t:'w',code,q,a:a.split('|'),e});
const D=(l,q,a,e)=>add({l,k:'d',t:'d',q,a:a.split('|'),e});

/* --- 第3回 複数行副問い合わせ --- */
C(3,'①',`複数行条件を3つ選びなさい。`,[`IN`,`ANY`,`ALL`,`BETWEEN`,`AND`],`複数行条件は IN・ANY・ALL の3つです。`,3);
W(3,'④',`複数行条件のうち、戻された値の「どれか」と比較するときに使うキーワードは？`,`ANY|SOME`,`ANY は「どれか」。比較を OR で結んだものです。`);
W(3,'⑦',`複数行条件のうち、戻された値の「すべて」と比較するときに使うキーワードは？`,`ALL`,`ALL は「すべて」。比較を AND で結んだものです。`);
C(3,'⑤',`> ANY (副問い合わせ) の意味として正しいものはどれですか？`,[`戻された値の最小値より大きい`,`戻された値の最大値より大きい`,`戻された値の最大値より小さい`,`戻された値の最小値より小さい`],`「どれかより大きい」＝一番小さい値より大きければよい、ということです。`);
C(3,'⑤',`< ANY (副問い合わせ) の意味として正しいものはどれですか？`,[`戻された値の最大値より小さい`,`戻された値の最小値より小さい`,`戻された値の最大値より大きい`,`戻された値の最小値より大きい`],`「どれかより小さい」＝一番大きい値より小さければよい、ということです。`);
C(3,'⑧',`> ALL (副問い合わせ) の意味として正しいものはどれですか？`,[`戻された値の最大値より大きい`,`戻された値の最小値より大きい`,`戻された値の平均より大きい`,`戻された値の最大値より小さい`],`「すべてより大きい」＝一番大きい値より大きい、ということです。`);
C(3,'⑧',`< ALL (副問い合わせ) の意味として正しいものはどれですか？`,[`戻された値の最小値より小さい`,`戻された値の最大値より小さい`,`戻された値の最小値より大きい`,`戻された値の平均より小さい`],`「すべてより小さい」＝一番小さい値より小さい、ということです。`);
W(3,'⑥',`= ANY と同じ意味になる複数行条件は何ですか？`,`IN`,`IN は = を OR で結んだもの。= ANY も同じ意味です。`);
W(3,'⑨',`<> ALL と同じ意味になる条件は何ですか？`,`NOT IN`,`「すべてと等しくない」＝ NOT IN と同じです。`);
C(3,'③',`NOT IN を使った副問い合わせで、副問い合わせの結果に NULL が含まれていました。結果はどうなりますか？`,[`0行が返る`,`NULL以外と比べた結果が返る`,`エラーになる`,`主問い合わせの全行が返る`],`NOT IN は比較の AND。<> NULL が1つでもあると unknown になり、決して true になりません。`);
C(3,'①',`ANY と ALL の使い方として正しいものはどれですか？`,[`単一行条件と組み合わせて使う（単独では使えない）`,`単独で使う（WHERE job ANY (…)）`,`IN と組み合わせて使う`,`GROUP BY 句の中で使う`],`> ANY、< ALL のように単一行条件（左）と ANY/ALL（右）を組み合わせます。`);
C(3,'⑩',`「使わない方がよい条件」の組み合わせはどれですか？`,[`<> ANY と = ALL`,`> ANY と < ALL`,`IN と NOT IN`,`= ANY と <> ALL`],`<> ANY は何でもOKになり、= ALL はありえない条件なので使いません。`);
C(3,'K',`SELECT ename, job FROM emp WHERE sal >= (SELECT sal FROM emp WHERE job = 'SALES'); で、job が SALES の人は複数います。結果は？`,[`エラーになる`,`SALESの給与以上の人が表示される`,`0行が返る`,`SALESの人だけが表示される`],`副問い合わせが複数行を返すのに >= （単一行条件）を使っているのでエラーです。`);
K(3,`SELECT ename FROM emp\nWHERE sal > ___ (SELECT sal FROM emp WHERE deptno = 30);`,`30番の部署の「全員より」給与が高い人を出したい。空欄は？`,`ALL`,`「すべてより大きい」は > ALL（最大値より大きい）です。`);
K(3,`SELECT ename FROM emp\nWHERE job ___ (SELECT job FROM emp WHERE deptno = 20);`,`20番の部署の「だれかと同じ」職種の人を出したい。空欄は？（2文字）`,`IN|=ANY`,`「いずれかと等しい」は IN（= ANY でも同じ）です。`);
D(3,`emp表から、部署番号(deptno)が10の社員のだれかと同じ職種(job)の社員の名前(ename)を表示するSELECT文を、複数行条件 IN を使って書きなさい。`,`SELECT ename FROM emp WHERE job IN (SELECT job FROM emp WHERE deptno = 10);|SELECT ename FROM emp WHERE job = ANY (SELECT job FROM emp WHERE deptno = 10);`,`副問い合わせが複数行を返すかもしれないので IN を使います。`);
D(3,`emp表から、部署番号(deptno)30の社員全員より給与(sal)が高い社員の名前(ename)を表示するSELECT文を書きなさい。`,`SELECT ename FROM emp WHERE sal > ALL (SELECT sal FROM emp WHERE deptno = 30);`,`「全員より高い」は > ALL を使います。`);

/* --- 第4回 集合演算 --- */
W(4,'①',`列の数・データ型が一致している複数のSELECT文を組み合わせて、和・差・積を求める演算を何といいますか？`,`集合演算`,`集合演算を使った問い合わせは「複合問合せ」ともいいます。`);
W(4,'①',`集合演算を使った問い合わせは、別名で何問合せといいますか？`,`複合問合せ|複合問い合わせ|複合`,`複数のSELECT文を組み合わせるので「複合問合せ」です。`);
C(4,'③',`UNION の説明として正しいものはどれですか？`,[`どちらかに存在するすべての行を、重複を除いて返す`,`どちらかに存在するすべての行を、重複も含めて返す`,`両方に存在する行だけを返す`,`左の結果から右の結果を取り除いた行を返す`],`UNION＝和集合。重複は1回だけ表示します。`);
C(4,'④',`UNION ALL の説明として正しいものはどれですか？`,[`重複するデータもすべて表示する`,`重複するデータは1回だけ表示する`,`両方に存在する行だけを表示する`,`重複したデータだけを表示する`],`UNION ALL は重複も含めて、行の数だけ表示します。`);
W(4,'⑤',`差集合を求める集合演算子は何ですか？`,`MINUS|EXCEPT`,`MINUS は左の結果から右の結果を取り除きます（21c以降は EXCEPT も可）。`);
W(4,'⑦',`両方の結果に存在する行（共通集合）を求める集合演算子は何ですか？`,`INTERSECT`,`INTERSECT＝共通集合（積集合）です。`);
C(4,'⑥',`A MINUS B の結果として正しいものはどれですか？`,[`集合Aの中から、集合Bに含まれる行を取り除いた行`,`集合Bの中から、集合Aに含まれる行を取り除いた行`,`AにもBにも含まれる行`,`AとBのすべての行`],`引かれる集合を左に、引く集合を右に置きます。A MINUS B と B MINUS A は結果が違います。`);
C(4,'⑧',`集合演算が成立する条件として正しいものを2つ選びなさい。`,[`SELECT句の列の数が同じ`,`SELECT句の列のデータ型に互換性がある`,`SELECT句の列名が同じ`,`同じ表を使っている`],`列名や表名は違ってもかまいません。`,2);
C(4,'⑧',`2つのSELECT文で列名が違うとき、集合演算の結果の列名はどうなりますか？`,[`1つ目のSELECT文の列名になる`,`2つ目のSELECT文の列名になる`,`エラーになる`,`列名は表示されない`],`1つ目のSELECT文の列名（列別名）が使われます。`);
C(4,'⑨',`UNION ALL 以外の集合演算で ORDER BY を書かないと、結果の並び順はどうなりますか？`,[`第1問合せの第1列でソートされる`,`表示順は決まっていない`,`第2問合せの第1列でソートされる`,`左の表の行、右の表の行の順に表示される`],`重複を調べるために第1列でソートされます。UNION ALL は第1問合せの結果のあとに第2問合せの結果が出ます。`);
C(4,'⑩',`集合演算で ORDER BY 句を書ける場所はどれですか？`,[`最後のSELECT文の文末に1度だけ`,`最初のSELECT文の文末だけ`,`それぞれのSELECT文の文末`,`ORDER BY は書けない`],`ORDER BY の列名は1つ目のSELECT文の列名（列別名）に合わせます。`);
C(4,'T',`Oracle の集合演算として存在しないものはどれですか？`,[`補集合`,`和集合`,`差集合`,`共通集合`],`和＝UNION、差＝MINUS、共通（積）＝INTERSECT。補集合や商はありません。`);
K(4,`SELECT empno FROM emp\n___\nSELECT empno FROM emp_old;`,`両方の表の行を、重複も含めてすべて表示したい。空欄は？`,`UNION ALL`,`重複も含めるなら UNION ALL です。`);
K(4,`SELECT empno FROM emp\n___\nSELECT empno FROM emp_old;`,`emp にはあって emp_old にはない社員番号を出したい。空欄は？`,`MINUS|EXCEPT`,`「左にあって右にない」は差集合の MINUS です。`);
D(4,`emp表とemp2表の社員番号(empno)と名前(ename)を、重複を除いてすべて表示するSQLを書きなさい。`,`SELECT empno, ename FROM emp UNION SELECT empno, ename FROM emp2;`,`重複を除いた和集合は UNION です。`);
D(4,`emp表にもemp2表にもある社員番号(empno)を表示するSQLを書きなさい。`,`SELECT empno FROM emp INTERSECT SELECT empno FROM emp2;`,`両方にある行は INTERSECT で求めます。`);

C(5,'⑥',`INSERT INTO dept VALUES (50, '製造', '博多'); について正しいものを2つ選びなさい。`,[`表定義の順番（DESCの順）に値が入る`,`表定義の列数と合わないとエラーになる`,`表名の後ろに列名がないのでエラーになる`,`列数が合わないと残りの列にはNULLが入る`],`列名リストを省略したときは、すべての列の値を表定義の順に書きます。`,2);
C(5,'⑧',`JOB列を 'MANAGER'、SAL列を 3000 に変更する SET句として正しいものはどれですか？`,[`SET job = 'MANAGER', sal = 3000`,`SET job = 'MANAGER' AND sal = 3000`,`SET job = 'MANAGER' SET sal = 3000`,`SET (job, sal) = 'MANAGER', 3000`],`複数列の更新は「列名 = 値」をカンマで区切ります。`);
C(5,'⑩',`WHERE句をつけずに UPDATE emp SET sal = 1000; を実行するとどうなりますか？`,[`すべての行の sal が 1000 になる`,`1行目だけ変更される`,`エラーになる`,`何も変更されない`],`WHERE を忘れると全行が変更されます。`);

W(6,'②',`複数の接続を区別する単位（接続してから切断するまでの一連の処理）を何といいますか？`,`セッション`,`データベースサーバーがセッションIDなどを割り振って管理します。`);

W(6,'⑤',`トランザクションを確定するSQLは何ですか？`,`COMMIT`,`COMMIT からCOMMIT までが1つのトランザクションです。`);
W(6,'⑥',`トランザクションを取り消すSQLは何ですか？`,`ROLLBACK`,`前回のコミット時、またはセーブポイントまで戻ります。`);
W(6,'⑦',`ロールバック時に戻る位置を保存しておくSQLは何ですか？`,`SAVEPOINT`,`SAVEPOINT 名前; で保存し、ROLLBACK TO 名前; で戻ります。`);
C(6,'⑦',`SAVEPOINT を発行したとき、トランザクションはどうなりますか？`,[`終了しない`,`確定されて終了する`,`取り消されて終了する`,`新しいセッションが始まる`],`セーブポイントを置いても、そこまでロールバックしても、トランザクションは終わりません。`);
C(6,'⑧',`COMMIT を実行したとき以外で、トランザクションが正常に終了するタイミングを2つ選びなさい。`,[`CREATE TABLE文などのDDLを実行したとき`,`ROLLBACKを発行したとき`,`ネットワークが切断されたとき`,`SAVEPOINTを発行したとき`],`DDL・DCLを実行すると直前のトランザクションが暗黙的にコミットされます。ROLLBACKも正常な終了です。`,2);
C(6,'⑨',`接続中に障害が起きて異常終了したとき、確定していないトランザクションはどうなりますか？`,[`暗黙的にロールバックされる`,`暗黙的にコミットされる`,`セーブポイントまでコミットされる`,`次に接続したときに選べる`],`データの整合性を守るため、異常切断では自動的にロールバックされます。`);
W(6,'⑩',`SELECT文の実行中に他のユーザーがデータを変更しても、SELECT文を始めた時点のデータを返すしくみを何といいますか？`,`読み取り一貫性`,`途中でCOMMITされても、実行中のSELECT文の結果は変わりません。`);
C(6,'⑩',`ユーザXがSELECT文を実行中に、ユーザYが関連するデータをUPDATEしてCOMMITしました。正しいものはどれですか？`,[`ユーザXにはSELECT文開始時のデータが返る`,`ユーザXには変更後のデータが返る`,`ユーザXのSELECT文はエラーになる`,`ユーザYのCOMMITは失敗する`],`読み取り一貫性のしくみです。`);

/* ===== カルテ（第2〜19回・全問を選択式に） =====
  R(回, 問番号, 問題, [選択肢…], 解説, 正解数) … 先頭から「正解数」個が正解 */
const R=(l,no,q,o,e,n=1)=>add({l,k:'r',t:'c',src:no,q,o,n,e});
/* 第2回 単一行副問い合わせ */
R(2,1,`SELECT文のWHERE句などに、他のSELECT文の結果を利用する問い合わせを何といいますか？`,[`副問い合わせ`,`主問い合わせ`,`集合演算`,`結合`],`外側を主問い合わせ、内側を副問い合わせといいます。副問い合わせはSELECT文以外でも使えます。`);
R(2,2,`空欄に入る組み合わせはどれですか？\n・副問い合わせと主問い合わせでは【①】が先に実行される\n・【②】の結果は【③】で利用される`,[`①副問い合わせ　②副問い合わせ　③主問い合わせ`,`①主問い合わせ　②主問い合わせ　③副問い合わせ`,`①副問い合わせ　②主問い合わせ　③副問い合わせ`,`①主問い合わせ　②副問い合わせ　③主問い合わせ`],`( ) の中から先に実行され、その結果が主問い合わせに戻されて使われます。`);
R(2,3,`次のようなSELECT文を何といいますか？\nSELECT EMPNAME, SALARY FROM EMPLOYEE\nWHERE SALARY >= (SELECT AVG(SALARY) FROM EMPLOYEE);`,[`単一行副問い合わせ`,`複数行副問い合わせ`,`複数列副問い合わせ`,`集合演算`],`演算子が >= なので単一行副問い合わせです。複数行は IN・ANY・ALL、複数列は WHERE (job, sal) = (…) の形です。`);
R(2,4,`次のSQLで、副問い合わせ（内側のSELECT文）は何行返りますか？\nSELECT EMPNAME, SALARY FROM EMPLOYEE\nWHERE SALARY >= (SELECT AVG(SALARY) FROM EMPLOYEE);`,[`1行返る`,`複数行返る`,`構文エラーになる`,`0行返る`],`グループ関数を使い GROUP BY句がない副問い合わせは、必ず1行を返します。`);
R(2,5,`内側のSELECT文が複数行を戻す問い合わせを何といいますか？`,[`複数行副問い合わせ`,`単一行副問い合わせ`,`複数列副問い合わせ`,`主問い合わせ`],`単一行・複数行は、副問い合わせが戻す行数のことです。確実に1行という確信がなければ複数行条件を使います。`);
R(2,6,`次の副問い合わせはエラーになります。理由を正しく説明しているものはどれですか？\nSELECT * FROM emp WHERE dept_id =\n  SELECT dept_id FROM emp WHERE ename = 'KENJI';`,[`副問い合わせ部分が ( ) で囲まれていない`,`副問い合わせで = 演算子は使えない`,`副問い合わせの中で、dept_id列ではなく ename列で条件を指定できない`,`副問い合わせと主問い合わせで同じ表は使えない`],`副問い合わせは必ず ( ) で囲み、条件の右側に置きます。`);
R(2,7,`単一行副問い合わせで使用できる演算子を3つ選びなさい。`,[`=`,`>=`,`<>`,`IN`,`ALL`],`=、>、<、>=、<=、<> など、WHERE句で学んだ演算子が使えます。IN・ALLは複数行条件です。`,3);
R(2,8,`内側のSELECT文は複数行を返します。このSELECT文全体の結果はどうなりますか？\nSELECT empno, ename, sal FROM emp\nWHERE job = (SELECT job FROM emp WHERE deptno = 10);`,[`エラーになる`,`何も表示されない（0行返る）`,`複数行返る`,`1行だけ返る`],`「単一行副問い合わせにより2つ以上の行が戻されます」というエラーになります。IN などの複数行条件を使います。`);
R(2,9,`副問い合わせは「KING」を1行戻しましたが、emp表にKINGさんは2人いました。結果はどうなりますか？\nSELECT empno, ename, sal FROM emp\nWHERE ename IN (SELECT ename FROM emp WHERE job = 'PRESIDENT');`,[`エラーにならず、2人のKINGさんの情報が表示される`,`単一行副問い合わせに複数行条件を使っているのでエラー`,`当てはまる行数が複数なのでエラー`,`0行が返る`],`副問い合わせは1行だけなので問題なし。1行のときに複数行条件を使っても問題ありません。`);
R(2,10,`副問い合わせが1行も結果を返さなかったとき、SELECT文全体の結果はどうなりますか？`,[`0行が返る（何も表示されない）`,`エラーになる`,`全行が返る`,`NULLの行が1行返る`],`副問い合わせはNULLを返し、= NULL のような条件になります。エラーにはならず、行が戻らないだけです。`);
/* 第3回 複数行副問い合わせ */
R(3,1,`次の中から複数行条件を3つ選びなさい。`,[`ANY`,`ALL`,`IN`,`AND`,`OR`,`BETWEEN`],`複数行条件は IN・ANY・ALL。ANYとALLは単一行条件と組み合わせます。`,3);
R(3,2,`副問い合わせにおいて「いずれかと等しい」という意味の条件を2つ選びなさい。`,[`IN`,`=ANY`,`=`,`=ALL`],`IN は = を OR で結んだもの。ANYもORの意味なので IN と =ANY は同じです。=ALL は使わないようにします。`,2);
R(3,3,`複数行条件に NOT IN を使った副問い合わせで、副問い合わせの結果に NULL が含まれていました。主問い合わせの結果はどうなりますか？`,[`0行が返る`,`複数行が返る`,`エラーとなる`,`1行が返る`],`NOT IN は「どれとも一致しない」＝AND条件。NULLがあると unknown になり、決して true になりません。`);
R(3,4,`複数行条件のうち、戻された行の「どれか」と比較するときに使うキーワードはどれですか？`,[`ANY`,`ALL`,`IN`,`EXISTS`],`「どれか」と比べるときは > や < と ANY を組み合わせます。`);
R(3,5,`複数行条件のうち、戻された行の「すべて」と比較するときに使うキーワードはどれですか？`,[`ALL`,`ANY`,`IN`,`EXISTS`],`ALLはANYより厳しい条件なので、戻される行数はANYより少なくなります。`);
R(3,6,`次のSELECT文の結果はどうなりますか？（job列に SALES は複数行あります）\nSELECT ename, job FROM emp WHERE sal >=\n  (SELECT sal FROM emp WHERE job = 'SALES');`,[`エラーとなる`,`SALESの給与より多くもらっている人の名前と職種が返る`,`0行が返る`],`SALES の人が複数いるので複数行条件が必要です。>= は単一行条件なのでエラーです。`);
R(3,7,`次のSELECT文はエラーになります。理由として正しいものはどれですか？\nSELECT * FROM emp WHERE job ANY\n  (SELECT job FROM emp WHERE dept_id = 30);`,[`複数行条件（ANY）を単独では使用できないため`,`副問い合わせが複数行を戻すのに単一行条件を使っているため`,`副問い合わせの結果がNULLを含むため`],`ANY・ALL は必ず単一行条件と組み合わせます。単一行条件が左、ANY・ALLが右です。`);
R(3,8,`副問い合わせが返す複数の値のうち「最大値よりも小さい」という意味の演算子はどれですか？`,[`<ANY`,`>ANY`,`>IN`,`<ALL`],`「どれかより小さい」＝一番大きい値より小さければよい、という判定です。`);
R(3,9,`副問い合わせが返す複数の値のうち「最大値よりも大きい」という意味の演算子はどれですか？`,[`>ALL`,`>ANY`,`>MAX`,`>=`],`「どれと比べても大きい」＝「すべてより大きい」なので >ALL です。`);
R(3,10,`=ALL について正しく説明しているものはどれですか？`,[`戻された値の「すべてと一致する」という条件で、通常ありえない`,`IN と同じ意味で、どれかと一致するときに使う`,`この条件を使うと、主問い合わせの全行が戻される`,`この条件を使うと、エラーが戻される`],`=ALL は false になる可能性が高く意味がないので使いません。<>ANY も全行が戻りやすくバグの元です。`);
/* 第4回 集合演算 */
R(4,1,`集合演算について正しく説明しているものはどれですか？`,[`SELECT文の列の数・データ型が一致している複数のSELECT文を利用した演算`,`問合せの中に別の問合せをネストすること`,`SELECT文はすべて集合演算である`,`SELECT文が用いる表の構成が一致している複数のSELECT文を利用した演算`],`SELECT文の結果を1つの集合とみなし、和・差・積を求めます。Oracleには「商」は実装されていません。`);
R(4,2,`集合Bだけに含まれる部分（Aと重なる部分を除いたB）を求める集合演算はどれですか？`,[`B MINUS A`,`A MINUS B`,`A UNION B`,`B INTERSECT A`],`BからAに含まれるデータを引くので B MINUS A。MINUSは左右を入れかえると結果が変わります。`);
R(4,3,`A INTERSECT B を図（ベン図）で表すと、どの部分になりますか？`,[`AとBが重なっている部分`,`Aだけの部分`,`Bだけの部分`,`AとBの全体`],`INTERSECT は A と B の両方に含まれるデータだけを返します。`);
R(4,4,`2つの集合のすべての行を、重複するデータを除いて表示する演算はどれですか？\nSELECT emp_no, empname FROM emp 【　】 SELECT emp_no, empname FROM emp2;`,[`UNION`,`UNION ALL`,`INTERSECT`,`MINUS`],`UNION は、両方に含まれる重複データを1回だけ表示します。`);
R(4,5,`2つの集合のすべての行を、重複するデータも含めて表示する演算はどれですか？\nSELECT emp_no, empname FROM emp 【　】 SELECT emp_no, empname FROM emp2;`,[`UNION ALL`,`UNION`,`INTERSECT`,`MINUS`],`UNION ALL は、両方に含まれるデータをデータの数だけ表示します。`);
R(4,6,`集合演算の MINUS は、どの集合を実現しますか？`,[`差集合`,`和集合`,`共通集合`,`補集合`],`和集合＝UNION・UNION ALL、共通集合＝INTERSECT。補集合という集合演算はありません。`);
R(4,7,`A INTERSECT B はどのような集合になりますか？`,[`集合Aにも集合Bにも含まれる行を返す`,`集合Aと集合Bの重複を除いたすべての行を返す`,`集合Aの中から集合Bに含まれる行を取り除いた行を返す`,`集合Bの中から集合Aに含まれる行を取り除いた行を返す`],`INTERSECT は共通集合（2つの集合が交差する部分）です。`);
R(4,8,`集合演算が成立する条件として正しいものをすべて選びなさい。`,[`SELECT句で指定する列の数、データ型が一致していなければならない`,`SELECT句で指定する列名、表名は異なっていても構わない`,`SELECT句で指定する列の数、列名、データ型が一致していなければならない`,`SELECT句で指定する表が同じ表でなければならない`],`列の数とデータ型は合わせます。列名が違うときは1つ目の問合せの列名が使われます。`,2);
R(4,9,`UNION ALL 以外の集合演算で ORDER BY句を指定しない場合、表示の順番はどうなりますか？`,[`第1の文のSELECT句の1列目のデータでソートされる`,`左側の表の行が先、次に右側の表の行が表示される`,`右側の表の行が先、次に左側の表の行が表示される`,`特に決まった順番はなく、不定である`],`重複を調べるため、1つ目のSELECT文の第1列でソートされます。`);
R(4,10,`集合演算で ORDER BY句を指定するときの規則として正しいものはどれですか？`,[`最後の文の文末にのみ指定できる`,`それぞれのSELECT文の文末に別々に指定できる`,`第1の文の文末にのみ指定できる`,`ORDER BY句で並び順を変えることはできない`],`FROM句の副問合せ以外では、ORDER BY は文の一番最後に書くと覚えましょう。`);
/* 第5回 データ操作言語 */
R(5,1,`Oracleのデータ操作言語（DML）を3つ選びなさい。`,[`INSERT`,`UPDATE`,`DELETE`,`CREATE`,`GRANT`],`DMLは INSERT・UPDATE・DELETE・MERGE・SELECT。特に左の3つはしっかり覚えましょう。`,3);
R(5,2,`新規データを追加する文はどれですか？`,[`INSERT文`,`DELETE文`,`SELECT文`,`UPDATE文`],`追加は INSERT、変更は UPDATE、削除は DELETE です。`);

/* ===== アプリの版と自動更新 =====
  公開ページ（github.io）では version.json を見て、新しい版があれば
  問題を解いていないタイミングでローディング画面を出して自動で読み直す。
  版を上げるときは APP_VER と version.json を同じ値にする。 */
const APP_VER='2026-11-05.15';
let UPD=null;
const SAFE_VIEWS=['home','lessons','lesson','gram','test','record','setup'];
const isPages=/\.github\.io$/.test(location.hostname);
if(isPages&&location.search){try{history.replaceState(null,'',location.pathname)}catch(e){}}
function splash(msg){const s=document.getElementById('splash');if(!s)return;s.querySelector('.sp-msg').textContent=msg;s.classList.remove('hide')}
function hideSplash(){const s=document.getElementById('splash');if(s)s.classList.add('hide')}
function checkUpdate(){
  if(!isPages)return;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.v||j.v===APP_VER)return;
    let tried='';try{tried=sessionStorage.getItem('db3upd')||''}catch(e){}
    if(tried===j.v)return;   /* 一度読み直しても古いまま（反映待ち）なら、くり返さない */
    UPD=j.v;tryUpdate();
  }).catch(()=>{});
}
function tryUpdate(){
  if(!UPD||!SAFE_VIEWS.includes(view)||document.querySelector('.ov'))return;
  try{sessionStorage.setItem('db3upd',UPD)}catch(e){}
  splash('最新版に更新しています…');
  setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(UPD)),700);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
setInterval(checkUpdate,5*60*1000);

  公開ページ（github.io）で、FB の設定が入っているときだけ動く。
  Firestore の ranking/<自分のuid> に {name, ok, solved, updated} を保存し、全員分を読んで順位を出す。 */
const FB={apiKey:'AIzaSyAosSUB9WTWS6vkla79APxjQjh8rFs5n7Y',projectId:'db3-drill'};
const RANK_ON=isPages&&!!FB.apiKey&&!!FB.projectId;
let RK=null;try{RK=JSON.parse(localStorage.getItem('db3rank')||'null')}catch(e){}
const rkSave=()=>{try{localStorage.setItem('db3rank',JSON.stringify(RK))}catch(e){}};
async function rkToken(){
  if(RK&&RK.idToken&&RK.exp>Date.now()+60000)return RK.idToken;
  if(RK&&RK.refresh){
    const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(RK.refresh)});
    if(r.ok){const j=await r.json();RK={uid:j.user_id,idToken:j.id_token,refresh:j.refresh_token,exp:Date.now()+(+j.expires_in)*1000};rkSave();return RK.idToken}
  }
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
  if(!r.ok)throw new Error('auth '+r.status);
  const j=await r.json();RK={uid:j.localId,idToken:j.idToken,refresh:j.refreshToken,exp:Date.now()+(+j.expiresIn)*1000};rkSave();return RK.idToken;
}
const FS=()=>`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
const myScore=()=>({ok:QS.filter(doneOk).length,solved:QS.filter(q=>S.r[q.id]).length});
let RANKS=null,RANKS_AT=0;
async function rkPush(force){
  if(!RANK_ON||!S.rank||!S.rank.name)return;
  const sc=myScore(),key=S.rank.name+'|'+sc.ok+'|'+sc.solved;
  if(!force&&S.rank.last===key)return;
  const t=await rkToken();
  const body={fields:{name:{stringValue:S.rank.name},ok:{integerValue:String(sc.ok)},solved:{integerValue:String(sc.solved)},updated:{integerValue:String(Date.now())}}};
  const r=await fetch(`${FS()}/ranking/${RK.uid}`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('push '+r.status);
  S.rank.last=key;save();RANKS=null;
}
async function rkFetch(){
  if(RANKS&&Date.now()-RANKS_AT<60000)return RANKS;
  const t=await rkToken();const out=[];let page='';
  do{
    const r=await fetch(`${FS()}/ranking?pageSize=300${page?'&pageToken='+encodeURIComponent(page):''}`,{headers:{Authorization:'Bearer '+t}});
    if(!r.ok)throw new Error('list '+r.status);
    const j=await r.json();
    (j.documents||[]).forEach(d=>{const f=d.fields||{};out.push({uid:d.name.split('/').pop(),name:(f.name&&f.name.stringValue)||'？',ok:+((f.ok&&f.ok.integerValue)||0),solved:+((f.solved&&f.solved.integerValue)||0)})});
    page=j.nextPageToken||'';
  }while(page);
  RANKS=out;RANKS_AT=Date.now();return out;
}
async function rkLeave(){
  const t=await rkToken();
  const r=await fetch(`${FS()}/ranking/${RK.uid}`,{method:'DELETE',headers:{Authorization:'Bearer '+t}});
  if(!r.ok&&r.status!==404)throw new Error('leave '+r.status);
  S.rank=null;save();RANKS=null;
}
/* 順位：正解数が多い順。正解数が同じなら同じ順位 */
function rkStanding(list){
  const me=RK&&list.find(x=>x.uid===RK.uid);if(!me)return null;
  const sc=myScore();me.ok=sc.ok;me.solved=sc.solved;me.name=S.rank.name;
  const sorted=list.slice().sort((a,b)=>b.ok-a.ok||b.solved-a.solved);
  const higher=sorted.filter(x=>x.ok>me.ok);
  return {n:list.length,rank:higher.length+1,me,above:higher[higher.length-1]||null,below:sorted.find(x=>x.ok<me.ok)||null,ties:sorted.filter(x=>x.ok===me.ok&&x!==me).length};
}
const rkName=s=>String(s||'').replace(/[\u0000-\u001f]/g,'').trim().slice(0,12);
/* ランキングのカード（compact=true はホーム用の1行） */
async function rankCard(el,compact){
  if(!RANK_ON||!el)return;
  if(!S.rank){
    if(compact){el.innerHTML='';return}
    el.innerHTML=`<section class="card rank"><h2>ランキング</h2>
      <p class="muted small">使っている人の中で、<b>正解した問題の数</b>が何位かがわかります。ほかの人に表示されるのはニックネームだけです。いつでもやめられます。</p>
      <div class="row" style="gap:8px"><input class="ans-input" id="rkn" maxlength="12" placeholder="ニックネーム（12文字まで）" style="flex:1;min-width:0"><button class="btn primary" id="rkj">参加する</button></div>
      <p class="small" id="rkmsg" style="color:var(--ng)"></p></section>`;
    const go1=async()=>{const n=rkName(document.getElementById('rkn').value);const m=document.getElementById('rkmsg');
      if(!n){m.textContent='ニックネームを入れてください';return}
      m.style.color='var(--sub)';m.textContent='参加しています…';
      S.rank={name:n};save();
      try{await rkPush(true);sfx('good');rankCard(el,compact)}catch(e){S.rank=null;save();m.style.color='var(--ng)';m.textContent='通信できませんでした。電波のよいところでもう一度ためしてください。'}};
    document.getElementById('rkj').onclick=go1;
    document.getElementById('rkn').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229)go1()};
    return;
  }
  el.innerHTML=compact?'':`<section class="card rank"><h2>ランキング</h2><p class="muted small">読み込み中…</p></section>`;
  let st;
  try{await rkPush().catch(()=>{});const list=await rkFetch();st=rkStanding(list);if(!st){await rkPush(true);RANKS=null;st=rkStanding(await rkFetch())}}
  catch(e){if(!compact)el.innerHTML=`<section class="card rank"><h2>ランキング</h2><p class="muted small">通信できませんでした。</p><button class="btn" id="rkr">もう一度読みこむ</button></section>`;const b=document.getElementById('rkr');if(b)b.onclick=()=>{RANKS=null;rankCard(el,compact)};return}
  if(!st)return;
  const gapUp=st.above?st.above.ok-st.me.ok:0,gapDn=st.below?st.me.ok-st.below.ok:0;
  if(compact){
    el.innerHTML=`<button class="rankmini" id="rkgo"><span class="rk-pos"><b>${st.n}</b>人中 <b class="rk-big">${st.rank}</b>位</span><span class="rk-sub">${st.above?`次の人まで あと <b>${gapUp}</b>問`:'いま1位です！'}</span><span class="chev" aria-hidden="true">›</span></button>`;
    document.getElementById('rkgo').onclick=()=>go('record');return;
  }
  const row=(x,cls,label)=>x?`<li class="${cls}"><span class="rk-l">${label}</span><span class="rk-n">${esc(x.name)}${x===st.me?'（あなた）':''}</span><span class="rk-s num">${x.ok}問</span></li>`:'';
  el.innerHTML=`<section class="card rank">
    <div class="row between"><h2>ランキング</h2><span class="small muted">正解した問題の数</span></div>
    <div class="rk-head"><span><b class="num">${st.n}</b>人中</span><b class="rk-big num">${st.rank}</b><span>位</span></div>
    <p class="rk-gap">${st.above?`次の人（${esc(st.above.name)}）まで <b>あと ${gapUp}問</b>`:'<b>いま1位です！</b>'}${st.ties?`<br><span class="small muted">同じ正解数の人が ${st.ties}人います</span>`:''}</p>
    <ol class="rk-list">${row(st.above,'up','1つ上')}${row(st.me,'me','あなた')}${row(st.below,'down','1つ下')}</ol>
    ${st.below?`<p class="small muted">後ろの人（${esc(st.below.name)}）とは ${gapDn}問差です。</p>`:''}
    <div class="row" style="gap:8px"><button class="btn" id="rkre">ニックネームを変える</button><button class="btn ghost" id="rkl">ランキングをやめる</button></div>
    <p class="small muted">正解した問題＝640問のうち、最後に解いたとき正解だった問題の数です。問題を解き終わるたびに自動で送られます。</p></section>`;
  document.getElementById('rkre').onclick=()=>modal(`<h2>ニックネームを変える</h2><input class="ans-input" id="rkn2" maxlength="12" value="${esc(S.rank.name)}"><div class="row end"><button class="btn" id="rkc">やめる</button><button class="btn primary" id="rks">変える</button></div>`,()=>{
    document.getElementById('rkc').onclick=closeModal;
    document.getElementById('rks').onclick=async()=>{const n=rkName(document.getElementById('rkn2').value);if(!n)return;const old=S.rank.name;S.rank.name=n;save();closeModal();try{await rkPush(true)}catch(e){S.rank.name=old;save()}rankCard(el,compact)};
  });
  document.getElementById('rkl').onclick=()=>modal(`<h2>ランキングをやめますか？</h2><p class="muted">あなたの順位の記録をランキングから消します。アプリの中の記録（正答率など）はそのまま残ります。</p><div class="row end"><button class="btn" id="rkc">やめない</button><button class="btn primary" id="rky">やめる</button></div>`,()=>{
    document.getElementById('rkc').onclick=closeModal;
    document.getElementById('rky').onclick=async()=>{closeModal();try{await rkLeave()}catch(e){toast('通信できませんでした')}rankCard(el,compact)};
  });
}

let AC=null;

function tone(f,t0,d,type,v,f2){const c=ac();if(!c)return;const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03)}

/* ===== 採点 ===== */
function normW(s){
  s=String(s).normalize('NFKC').toUpperCase().replace(/[‘’]/g,"'");
  s=s.replace(/\s+/g,'').replace(/[;。、．，「」『』・ー]/g,'').replace(/問い?合わ?せ/g,'問合せ');
  return s.replace(/(制約|オプション|コマンド|キーワード|文)$/,'');
}
function normS(s){return String(s).normalize('NFKC').toUpperCase().replace(/[‘’]/g,"'").replace(/\s+/g,'').replace(/;+$/,'')}

references:{j:'deptno 列は2桁の数字で、dept表の deptno に存在する値しか入れられないようにして。',p:[['deptno NUMBER(2)','この表（子表）の列。これが外部キーになる'],['REFERENCES dept(deptno)','dept表（親表）の deptno 列（親キー）を参照する。dept にない部署番号は入れられない']]},
view:{j:'20番の部署の人の社員番号と名前だけを見せる emp20 というビューを作って。',p:[['CREATE VIEW emp20 AS','emp20 というビューを、次の SELECT 文として作る'],['SELECT empno, ename FROM emp','見せる列'],['WHERE deptno = 20','見せる行。ビューを使うと、この SELECT の結果が表のように見える']]},

synonym:{j:'scott さんの emp表に、e という別名をつけて。',p:[['CREATE SYNONYM e','e という別名（シノニム）を作る'],['FOR scott.emp','scott スキーマの emp表の別名にする。これで SELECT * FROM e; と書ける']]},

/* ===== 授業回の4ステップ ===== */
const STEPS=[
  {id:'note',name:'ノートで覚える',desc:'授業シートの要点を赤シートでかくして暗記します。'},
  {id:'check',name:'チェック問題',desc:'ノートの要点が覚えられたか、4択でたしかめます。'},
  {id:'karte',name:'カルテ',desc:'授業のカルテを問1から順番に解きます。'},
  {id:'practice',name:'練習問題',desc:'単語・コードの穴埋め・SQLを書く問題で仕上げます。'}
];
function stepQs(l,id){
  if(id==='check')return QS.filter(q=>q.l===l&&q.k==='p');
  if(id==='karte')return karteOf(l).sort((a,b)=>a.src-b.src);
  if(id==='practice')return QS.filter(q=>q.l===l&&(q.k==='s'||q.k==='k'||q.k==='d'));
  return [];
}
function stepInfo(l,id){
  if(id==='note'){const n=NOTES[l].length,m=Object.values(S.m[l]||{}).filter(Boolean).length;return {n,a:m,done:!!S.nr[l]||m===n,label:`覚えた ${m} / ${n}`}}
  const qs=stepQs(l,id),tried=qs.filter(q=>S.r[q.id]).length,ok=qs.filter(doneOk).length;
  return {n:qs.length,a:ok,tried,done:qs.length>0&&tried===qs.length,label:tried?`正解 ${ok} / ${qs.length}${tried<qs.length?`（あと${qs.length-tried}問）`:''}`:`${qs.length}問`};
}
const lessonSteps=l=>STEPS.filter(s=>s.id==='note'||stepQs(l,s.id).length);
function lessonProg(l){const st=lessonSteps(l);const d=st.filter(s=>stepInfo(l,s.id).done).length;return {d,n:st.length,next:st.find(s=>!stepInfo(l,s.id).done)}}
function nextUp(){for(const l of LESSONS.filter(x=>!(S.skipB&&x>90))){const p=lessonProg(l);if(p.next)return {l,step:p.next}}return null}
const dotsOf=l=>`<span class="dots" aria-hidden="true">${lessonSteps(l).map(s=>`<i class="${stepInfo(l,s.id).done?'on':''}"></i>`).join('')}</span>`;
function startStep(l,id){
  CUR=l;
  if(id==='note'){go('note',{l});return}
  const st=STEPS.find(s=>s.id===id),all=stepQs(l,id),inf=stepInfo(l,id);
  let list=all;
  if(!inf.done&&inf.tried)list=all.filter(q=>!S.r[q.id]);
  if(id!=='karte')list=shuffle(list);
  startQuiz(list,`${lname(l)} ${st.name}`,{ctx:{l,step:id}});
}

  return {tried:tried.length,acc:all?Math.round(ok/all*100):null,lessonsDone:LESSONS.filter(l=>l<90&&!lessonProg(l).next).length,lessonN:LESSONS.filter(l=>l<90).length}}

/* ===== SQLを見やすく表示する =====
  ・長い1行のSQLは、FROM・WHERE などの前で改行し、( SELECT … ) の副問い合わせは字下げする
  ・問題文の中のSQLは、文章と分けてコード用の枠に入れる */
const SQL_BREAK=/^(SELECT|FROM|WHERE|GROUP BY|HAVING|ORDER BY|VALUES|SET|UNION ALL|UNION|MINUS|INTERSECT|EXCEPT|JOIN|LEFT OUTER JOIN|ON|WITH CHECK OPTION|WITH READ ONLY)\b/i;
const SQL_WIDTH=34;
let SW=SQL_WIDTH;
function fmtSQL(s,w){
  s=String(s);
  if(s.includes('\n'))return s.split('\n').map(x=>fmtSQL(x,w)).join('\n');
  const width=w||SQL_WIDTH;
  if(s.length<=width)return s;
  const pad=s.match(/^\s*/)[0],prev=SW;SW=width;
  try{return fmtLines(s.trim(),pad)}finally{SW=prev}
}
function fmtLines(s,pad){
  /* 深さ0の句の前で区切る（' ' の中や ( ) の中は区切らない） */
  const parts=[];let depth=0,q=false,start=0;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==="'"){q=!q;continue}
    if(q)continue;
    if(c==='(')depth++;else if(c===')')depth--;
    else if(depth===0&&i>start&&s[i-1]===' '&&SQL_BREAK.test(s.slice(i))&&!/^ON\b/i.test(s.slice(i))){parts.push(s.slice(start,i).trim());start=i}
  }
  parts.push(s.slice(start).trim());
  return parts.map(line=>pad+fmtSub(line,pad)).join('\n');
}
function fmtSub(line,pad){
  /* 長い行の中の ( SELECT … ) を、字下げした別の行にする */
  if((pad+line).length<=SW)return line;
  const m=/\(\s*SELECT\b/i.exec(line);if(!m)return line;
  let depth=0,q=false,end=-1;
  for(let i=m.index;i<line.length;i++){const c=line[i];if(c==="'"){q=!q;continue}if(q)continue;if(c==='(')depth++;else if(c===')'){depth--;if(depth===0){end=i;break}}}
  if(end<0)return line;
  const head=line.slice(0,m.index).trimEnd(),inner=line.slice(m.index+1,end).trim(),tail=line.slice(end+1);
  return `${head} (\n${fmtLines(inner,pad+'    ')}\n${pad})${tail}`;
}
const SQL_KW=/^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|GRANT|REVOKE|TRUNCATE|WHERE|FROM|VALUES|SET|ROLLBACK|SAVEPOINT|COMMIT|DESC)(?=[\s(*])/i;
const SQL_CHAR=/^(?:'[^']*'|【[^】]*】|[\x20-\x7E]|…)*/;
const PARTICLE=/^(で|の|に|を|と|は|が|について|では)/;
/* 問題文を、文章の行とSQLの行に分けてHTMLにする */
function qHTML(text){
  const out=[];let buf=[];
  const flush=()=>{if(buf.length){out.push(`<pre class="code qsql">${esc(buf.map(fmtSQL).join('\n'))}</pre>`);buf=[]}};
  String(text).split('\n').forEach(line=>{
    const isTpl=/【[^】]*】/.test(line)&&/;\s*$/.test(line)&&!/[。？]/.test(line);
    if(buf.length&&/^\s*\(/.test(line)&&!/[。？]/.test(line)){buf[buf.length-1]+=' '+line.trim();return}   /* ( で始まる続きの行は前の行につなげる */
    if(!SQL_KW.test(line)&&!isTpl){flush();out.push(`<p>${esc(line)}</p>`);return}
    const pre=line.match(SQL_CHAR)[0],rest=line.slice(pre.length).trim();
    if(!rest||(!/[。？、]/.test(rest)&&!PARTICLE.test(rest))){buf.push(line);return}   /* 行全体がSQL */
    const code=pre.trim();
    if(/[;)]$/.test(code)||PARTICLE.test(rest)){
      flush();
      if(code.length<=24&&!code.includes(';'))out.push(`<p><code>${esc(code)}</code> ${esc(rest)}</p>`);  /* 短いものは文の中に */
      else{out.push(`<pre class="code qsql">${esc(fmtSQL(code))}</pre>`);out.push(`<p>${esc(rest)}</p>`)}
      return;
    }
    flush();out.push(`<p>${esc(line)}</p>`);
  });
  flush();
  return out.join('');
}
/* 選択肢がSQLならコード用の文字にする */
const isSQLopt=s=>/^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|GRANT|REVOKE|TRUNCATE|WHERE|SET|VALUES|PRIMARY KEY|UNIQUE|CHECK|REFERENCES|FOREIGN KEY|DEFAULT|ROUND|NVL|COUNT)(?=[\s(;]|$)/.test(s)&&!/[。]/.test(s);
const optHTML=s=>isSQLopt(s)?`<span class="ocode">${esc(fmtSQL(s))}</span>`:br(s);

/* 答えの中の SQL っぽい部分を code 表示に */
const STMT=/((?:CREATE|DROP|ALTER|INSERT|UPDATE|DELETE|SELECT|GRANT|REVOKE|TRUNCATE|ROLLBACK|SAVEPOINT|DESC)\b[^、。／（）]*?;)/;
function fmtInline(t){return esc(t).replace(/(WHERE [^、。／）]+?\)|[A-Za-z_]+\.(?:NEXTVAL|CURRVAL))/g,'<code>$1</code>')}
function fmtSeg(t){
  /* SQLの文（; で終わる）はコード枠、それ以外は文章 */
  return t.split(STMT).map((x,i)=>i%2?`<code class="nb">${esc(fmtSQL(x.trim(),22))}</code>`:(x.trim()?`<span class="nt">${fmtInline(x.trim())}</span>`:'')).join('');
}
function fmtA(s){
  /* 「／」で区切った内容は箇条書き、「　」「例）」「※」の前で改行 */
  const items=String(s).split(/\s*／\s*/).filter(Boolean);
  const lines=it=>it.split(/　+|(?=例）)|(?=※)/).map(x=>x.trim()).filter(Boolean).map(x=>`<span class="al${/^(例）|※)/.test(x)?' sub':''}">${fmtSeg(x)}</span>`).join('');
  return items.length>1?`<ul class="alist">${items.map(it=>`<li>${lines(it)}</li>`).join('')}</ul>`:lines(items[0]||'');
}

/* 本番の分野別問題数どおりに50問。SQL記述は3問、残りは選択6：単語4くらい */
function buildMock(){
  const out=[];const dCats=shuffle([1,2,3,5,6,7,8]).slice(0,3);
  CATS.filter(c=>c.id).forEach(c=>{
    const qs=shuffle(QS.filter(q=>q.c===c.id));
    const d=qs.filter(q=>q.k==='d'),wd=qs.filter(q=>q.t==='w');
    const kr=qs.filter(q=>q.k==='r'),oc=qs.filter(q=>q.t==='c'&&q.k!=='r');
    const ch=[];while(kr.length||oc.length){if(kr.length)ch.push(kr.shift());if(kr.length)ch.push(kr.shift());if(oc.length)ch.push(oc.shift())}
    let need=c.n;const pick=[];
    if(dCats.includes(c.id)&&d.length){pick.push(d[0]);need--}
    const nc=Math.round(need*0.58);
    pick.push(...ch.slice(0,nc));pick.push(...wd.slice(0,need-Math.min(nc,ch.length)));
    const rest=qs.filter(q=>q.k!=='d'&&!pick.includes(q));
    while(pick.length<c.n&&rest.length)pick.push(rest.shift());
    out.push(...pick.slice(0,c.n));
  });
  return out;
}

      <ul class="klist"><li><b>シート内容チェック</b>ノートの要点の4択</li><li><b>カルテ</b>授業のカルテ</li><li><b>授業シート問題</b>選択・単語を書く</li><li><b>コードの単語</b>SQLの穴埋め</li><li><b>記述</b>SQL文を書く</li></ul></fieldset>
    <fieldset><legend class="label">② 分野（いくつでも）</legend><div class="row">${CATS.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${SET.cats.includes(c.id)}">${c.name}</button>`).join('')}</div>
      <div class="row"><button class="mini" id="allc">すべて</button><button class="mini" id="nonec">試験範囲だけ</button></div></fieldset>
    <fieldset><legend class="label">③ 問題数</legend><div class="row">${[10,20,30,0].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${SET.count===n}">${n?n+'問':'全部'}</button>`).join('')}</div></fieldset>
    <label class="toggle"><input type="checkbox" id="weak" ${SET.weak?'checked':''}>苦手（最後に間違えた問題）だけにする</label>
  </section>
  <div class="actbar"><div class="wrap"><span class="note">対象 <b class="num" style="color:var(--ink)">${pool.length}</b> 問</span><button class="btn primary grow" id="go" ${pool.length?'':'disabled'}>スタート ›</button></div></div>`;
  const tog=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{SET.kinds=tog(SET.kinds,b.dataset.k);renderSetup()});
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{SET.cats=tog(SET.cats,+b.dataset.c);renderSetup()});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{SET.count=+b.dataset.n;renderSetup()});
  document.getElementById('allc').onclick=()=>{SET.cats=CATS.map(c=>c.id);renderSetup()};
  document.getElementById('nonec').onclick=()=>{SET.cats=[1,2,3,4,5,6,7,8];renderSetup()};
  document.getElementById('weak').onchange=e=>{SET.weak=e.target.checked;renderSetup()};
  document.getElementById('go').onclick=()=>{const l=shuffle(pool);startQuiz(SET.count?l.slice(0,SET.count):l,'えらんだ問題')};
}

    <p class="small muted" style="margin-top:12px">本番の出題数：${CATS.filter(c=>c.id).map(c=>`${c.name} ${c.n}`).join('・')}（計50問）</p></section>
  <section class="card"><h2 style="margin-bottom:6px">記録を消す</h2><p class="small muted" style="margin-bottom:10px">解いた結果・覚えたチェックをすべて消して、最初からやり直します。</p><button class="btn" id="rs">記録をリセット</button></section>`;
  rankCard(document.getElementById('rankbox'),false);

/* ===== 問題を解く ===== */
function startQuiz(list,title,o={}){if(!list.length)return;Z={list,i:0,res:[],title,ctx:o.ctx||null};prep();go('quiz',{replace:view==='result'||view==='quiz'})}
function prep(){const q=Z.list[Z.i];Z.cur={done:false,sel:new Set(),order:q.t==='c'?shuffle(q.o.map((_,i)=>i)):null}}

function renderQuiz(){
  if(!Z){go('home',{replace:true});return}
  const q=Z.list[Z.i],cur=Z.cur,n=Z.list.length;
  const kind=q.k==='g'?'単語の意味':((q.k==='r'?`カルテ 問${q.src}・`:q.k==='p'?'ノートの要点・':'')+(q.t==='d'?'SQLを書く':q.k==='k'?'コードの穴埋め':q.t==='c'?(q.n>1?`${q.n}つ選ぶ`:'選択'):'単語を書く'));
  let body='',hint='',acts='';
  if(q.code)body+=`<pre class="code">${esc(q.code).replace(/___/g,'<span class="blank">？</span>')}</pre>`;
  if(q.t==='c'){
    body+=`<div class="opts">${cur.order.map((oi,j)=>{
      let cls='';if(cur.done){if(oi<q.n)cls='right';else if(cur.sel.has(oi))cls='wrong'}
      return `<button class="opt ${cls}" data-o="${oi}" aria-pressed="${cur.sel.has(oi)}" ${cur.done?'disabled':''}><span class="k">${'アイウエオカ'[j]}</span><span>${optHTML(q.o[oi])}</span></button>`}).join('')}</div>`;
    if(!cur.done){
      if(q.n>1){hint=`正しいものを <b>${q.n}つ</b> 選んでから、下の「答え合わせ」を押してください。`;acts=`<button class="btn primary grow" id="chk" ${cur.sel.size?'':'disabled'}>答え合わせ（${cur.sel.size} / ${q.n} 選択中）</button>`}
      else{hint='答えをタップすると、すぐに答え合わせします。';acts='<span class="note">答えをタップしてください</span>'}
    }
  }else if(q.t==='w'){
    body+=`<input class="ans-input" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.k==='k'?'空欄に入る言葉':'答えを入力'}" value="${esc(cur.given||'')}" ${cur.done?'disabled':''}>`;
    if(!cur.done){hint='入力して「答え合わせ」（Enterキーでも可）。大文字・小文字はどちらでもOK。';acts='<button class="btn" id="skip">わからない</button><button class="btn primary grow" id="chk">答え合わせ</button>'}
  }else{
    body+=`<textarea class="ans-input" id="inp" spellcheck="false" autocapitalize="off" placeholder="SQL文を入力" ${cur.done?'disabled':''}>${esc(cur.given||'')}</textarea>`;
    if(!cur.done){hint='大文字・小文字、改行、最後の ; はどちらでもOK（Ctrl+Enterでも答え合わせ）。';acts='<button class="btn" id="skip">わからない</button><button class="btn primary grow" id="chk">答え合わせ</button>'}
  }
  if(cur.done){const ov=!cur.ok&&q.t==='d'&&!cur.skipped;
    acts=`${ov?'<button class="btn" id="ov">自分の答えも正解</button>':''}<button class="btn primary grow" id="next">${Z.i+1<n?'次へ ›':'結果を見る ›'}</button>`}
  app.innerHTML=`
  <div class="qprog"><div class="progress" aria-hidden="true"><i style="width:${(Z.i+(cur.done?1:0))/n*100}%"></i></div><span class="small num"><b>${Z.i+1}</b> / ${n}</span></div>
  <section class="card qbody">
    <div class="row"><span class="pill">${q.k==='g'?'文法':catName(q.c)}</span><span class="pill plain">${kind}</span></div>
    <div class="qtext">${qHTML(q.q)}</div>
    ${body}
    ${hint?`<p class="hint">${hint}</p>`:''}
  </section>
  ${cur.done?feedback(q,cur):''}
  <div class="actbar"><div class="wrap">${acts}</div></div>`;
  if(!cur.done){
    if(q.t==='c'){
      app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const oi=+b.dataset.o;
        if(q.n===1){cur.sel=new Set([oi]);judge(oi<q.n)}
        else{sfx(cur.sel.has(oi)?'uncheck':'pick');cur.sel.has(oi)?cur.sel.delete(oi):cur.sel.add(oi);renderQuiz()}});
      const ck=document.getElementById('chk');if(ck)ck.onclick=()=>{const ok=cur.sel.size===q.n&&[...cur.sel].every(x=>x<q.n);judge(ok)};
    }else{
      const inp=document.getElementById('inp');
      if(matchMedia('(hover:hover)').matches)inp.focus();
      inp.oninput=()=>cur.given=inp.value;
      const check=()=>{cur.given=inp.value;if(!inp.value.trim()){inp.focus();return}const f=q.t==='w'?normW:normS;judge(q.a.map(f).includes(f(inp.value)))};
      document.getElementById('chk').onclick=check;
      document.getElementById('skip').onclick=()=>{cur.given=inp.value;cur.skipped=true;judge(false)};
      inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229&&(q.t==='w'||e.ctrlKey||e.metaKey)){e.preventDefault();e.stopPropagation();check()}};
    }
  }else{
    const nx=document.getElementById('next');nx.onclick=next;if(matchMedia('(hover:hover)').matches)nx.focus();
    const ov=document.getElementById('ov');if(ov)ov.onclick=()=>{const r=S.r[q.id];r[1]--;r[0]++;r[2]=1;save();Z.res[Z.i].ok=true;cur.ok=true;cur.over=true;renderQuiz()};
  }
}
function judge(ok){sfx(ok?'ok':'ng');const q=Z.list[Z.i];Z.cur.done=true;Z.cur.ok=ok;record(q,ok);Z.res[Z.i]={q,ok,given:Z.cur.given};renderQuiz();
  const fb=document.querySelector('.fb');if(fb&&fb.getBoundingClientRect().bottom>window.innerHeight-80)fb.scrollIntoView({block:'end',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function next(){sfx('page');if(Z.i+1<Z.list.length){Z.i++;prep();renderQuiz();window.scrollTo(0,0)}else go('result',{replace:true})}
function answerText(q){
  if(q.t==='c')return q.o.slice(0,q.n).map(o=>`<div>${optHTML(o)}</div>`).join('');
  if(q.t==='w')return `<code>${esc(q.a[0])}</code>${q.a.length>1?`<span class="small muted">（${q.a.slice(1).map(esc).join('・')} もOK）</span>`:''}`;
  return `<pre class="code">${esc(fmtSQL(q.a[0]))}</pre>${q.a.length>1?`<div class="small muted" style="margin-top:6px">別解</div><pre class="code">${esc(fmtSQL(q.a[1]))}</pre>`:''}`;
}
/* ===== 間違えたところと理由 ===== */
/* 4択の誤りの選択肢ごとの「なぜ違うか」。キーは問題ID、値は誤りの選択肢（正解のあとの並び順）ごとの理由 */
const WHY={"q1shz7o4":["副問い合わせは主問い合わせより「先」に実行され、その結果を主問い合わせが使います。","1行ごとに毎回実行されるのは「相関副問い合わせ」で、ふつうの副問い合わせは一度だけです。","同時ではありません。( ) の中が先に実行されて、結果が主問い合わせに渡されます。"],"q1qxa2mu":["HAVING句には副問い合わせを書けます（例：HAVING AVG(sal) > (SELECT …)）。","UPDATE文のSET句には副問い合わせを書けます（例：SET sal = (SELECT …)）。","INSERT文のVALUES句には副問い合わせを書けます。"],"q1m0wovx":["逆です。副問い合わせは比較条件の「右側」に置きます（WHERE 列 = (SELECT …)）。","ORDER BY は必須ではありません。副問い合わせの中では、ふつう ORDER BY は使いません。"],"qlocrxk":["= は単一行条件なので、副問い合わせが複数行を返すと結果は出ず、エラーになります。","0行になるのは副問い合わせが1行も返さないときです。3行返るとエラーです。","Oracle は勝手に1行目だけを使ったりしません。エラーになります。"],"qb3lczg":["複数行条件（IN）は、副問い合わせが1行だけ返しても問題なく使えます。","IN で1行と比べるのは = と同じなので、当てはまる行がふつうに返ります。","書き方は正しいので構文エラーにはなりません。"],"qv202aj":["副問い合わせが0行でもエラーにはなりません。NULL として扱われ、0行になるだけです。","副問い合わせは NULL になり、= NULL は true にならないので、どの行も選ばれません。","NULLの行が出てくるわけではなく、条件に当てはまる行がないので0行です。"],"qigrbeg":["グループ関数（AVG）を使っていて GROUP BY がないので、全体で1つの値＝必ず1行です。","emp表に行がある限り、AVG は1つの値を返すので0行にはなりません。","書き方は正しいので構文エラーにはなりません。"],"q18x639i":["主問い合わせは「外側」のSELECT文のことです。内側のSELECT文が副問い合わせです。","集合演算は UNION などで2つのSELECT文の結果を組み合わせるものです。","結合は JOIN などで表どうしをつなぐことです。"],"q107e59m":["先に実行されるのは主問い合わせではなく、副問い合わせ（( ) の中）です。","②は副問い合わせです。副問い合わせの結果を主問い合わせ（③）が使います。","①が違います。先に実行されるのは副問い合わせです。"],"qssalf3":["演算子が >= （単一行条件）なので、複数行ではなく単一行副問い合わせです。","複数列副問い合わせは WHERE (job, sal) = (SELECT job, sal …) のように複数の列を比べる形です。","集合演算は UNION・MINUS などで2つのSELECT文を組み合わせるものです。"],"qkp66r":["AVG はグループ関数で、GROUP BY がないので全体で1行にまとまります。","書き方は正しいので構文エラーにはなりません。","表に行がある限り AVG は値を返すので、0行にはなりません。"],"qboj23t":["単一行副問い合わせは、副問い合わせが1行だけ返すものです。","複数列副問い合わせは、複数の「列」をまとめて比べるものです。行の数の話ではありません。","主問い合わせは外側のSELECT文のことです。"],"q1rg114y":["副問い合わせでも = は使えます（1行を返すなら単一行条件でOK）。","副問い合わせの中では、どの列で条件をつけてもかまいません。","主問い合わせと副問い合わせで同じ表を使ってもかまいません。"],"q1n1qt0i":["IN は複数行条件です。単一行副問い合わせで使う演算子ではありません。","ALL は複数行条件です（> ALL のように使います）。"],"q1hpqymh":["0行になるのは副問い合わせが1行も返さないときです。複数行返るとエラーになります。","= は単一行条件なので、複数行と比べることはできずエラーです。","Oracle は1行だけ選んだりしません。「単一行副問い合わせにより2つ以上の行が戻されます」というエラーです。"],"q6ph3a8":["IN は複数行条件ですが、副問い合わせが1行でも問題なく使えます。","主問い合わせの結果が何行でもエラーにはなりません。エラーに関係するのは副問い合わせの行数です。","副問い合わせは「KING」を返しているので、KING さん2人が表示されます。"],"qtg26wb":["0行でもエラーにはなりません。副問い合わせは NULL を返すだけです。","= NULL は true にならないので、全行ではなく0行です。","NULLの行が表示されるわけではありません。当てはまる行がないので0行です。"],"qvbf43v":["BETWEEN は「a以上b以下」の範囲の条件で、複数行条件ではありません。","AND は条件と条件をつなぐ論理演算子です。"],"q191a6ac":["「最大値より大きい」は > ALL です。> ANY は「どれか1つより大きければOK」なので最小値より大きければよいです。","「小さい」ではなく「大きい」です。> は「より大きい」。","「最小値より小さい」は < ALL です。"],"qzhbbde":["「最小値より小さい」は < ALL（すべてより小さい）です。","< は「より小さい」なので「大きい」ではありません。","「大きい」ではありません。それは > ANY です。"],"q13vc03p":["「最小値より大きい」は > ANY（どれか1つより大きい）です。","ALL は平均ではなく、戻された値の「すべて」と比べます。","> は「より大きい」です。「小さい」にはなりません。"],"qubd56r":["「最大値より小さい」は < ANY（どれか1つより小さい）です。","< は「より小さい」です。「大きい」にはなりません。","ALL は平均ではなく、戻された値の「すべて」と比べます。"],"qh67j9f":["NOT IN は「どれとも等しくない」を AND でつないだもの。<> NULL が1つでもあると true にならず、0行です。","エラーにはなりません。結果が0行になるだけです。","全行ではありません。NULL があると条件が決して true にならないので0行です。"],"q1hvmsuk":["WHERE job ANY (…) のように単独では使えずエラーになります。= ANY のように使います。","IN と組み合わせることはありません。=、>、< などの単一行条件と組み合わせます。","ANY・ALL は WHERE句（やHAVING句）の比較で使います。GROUP BY の中ではありません。"],"q1e369l2":["> ANY（最小値より大きい）と < ALL（最小値より小さい）は、ふつうに使える条件です。","IN と NOT IN はよく使う条件です（NOT IN は NULL に注意）。","= ANY は IN と同じ、<> ALL は NOT IN と同じで、どちらも使える条件です。"],"q5gs1o8":["SALES の人は複数いるので、副問い合わせが複数行を返し、>= （単一行条件）ではエラーになります。","エラーになるので結果は出ません。0行になるのは副問い合わせが0行のときです。","エラーになるので何も表示されません。"],"qzilyfh":["AND は条件をつなぐ論理演算子で、複数行条件ではありません。","OR は条件をつなぐ論理演算子で、複数行条件ではありません。","BETWEEN は範囲の条件で、複数行条件ではありません。"],"qooua0":["= は単一行条件なので、副問い合わせが複数行を返すとエラーになります。","= ALL は「すべてと等しい」で、ふつうはありえないので使いません。"],"qor8mrs":["NOT IN の結果に NULL があると、条件が決して true にならないので1行も返りません。","エラーにはなりません。0行になるだけです。","NULL が含まれると、どの行も条件を満たさないので0行です。"],"q1dmpmmz":["ALL は「すべて」と比べるときに使います。","IN は「どれかと等しい」で、= の比較しかできません。「どれか」と大小を比べるときは ANY です。","EXISTS は副問い合わせが1行でも返すかどうかを調べるもので、値の比較ではありません。"],"q1l0wi2b":["ANY は「どれか」と比べるときに使います。","IN は「どれかと等しい」です。","EXISTS は行があるかどうかを調べるもので、値の比較ではありません。"],"q1kkfw34":["SALES の人が複数いるので副問い合わせが複数行を返し、>= ではエラーになります。","0行になるのは副問い合わせが0行のときです。今回はエラーです。"],"qtqxb67":["副問い合わせの行数の問題ではなく、ANY を = や > などと組み合わせずに単独で書いているのが原因です。","NULL が含まれていてもエラーにはなりません。"],"q1606vog":["> ANY は「最小値より大きい」です。","IN は「どれかと等しい」で、大小は比べられません。>IN という書き方はありません。","< ALL は「最小値より小さい」です。"],"q1gwsmpc":["> ANY は「最小値より大きい」です。","MAX は関数で、>MAX という演算子はありません。",">= は単一行条件で、複数の値と比べるとエラーになります。"],"qk5k1ye":["IN と同じ意味なのは = ANY です。","全行が戻されやすいのは <> ANY のほうです。= ALL はほとんど当てはまりません。","エラーにはなりません。書けますが、ふつう当てはまる行がないので使いません。"],"q1fcrj57":["重複も含めて返すのは UNION ALL です。UNION は重複を1回にします。","両方にある行だけを返すのは INTERSECT です。","左から右を取り除くのは MINUS です。"],"qb5eu2s":["重複を1回だけにするのは UNION です。","両方にある行だけを表示するのは INTERSECT です。","重複したデータだけを出す集合演算はありません。"],"q1s8k3pf":["それは B MINUS A です。左の集合から右の集合を引きます。","両方に含まれる行は INTERSECT です。","すべての行は UNION（UNION ALL）です。"],"q1iix8db":["列名は違ってもかまいません（結果の列名は1つ目のSELECT文のもの）。","違う表どうしでも集合演算できます。"],"qn9g1tw":["2つ目ではなく、1つ目のSELECT文の列名が使われます。","列名が違ってもエラーにはなりません。","列名は表示されます（1つ目のSELECT文の列名）。"],"q12k2dsj":["重複を調べるために並べかえるので、第1問合せの第1列の順になります。","第2問合せではなく、第1問合せの第1列です。","それは UNION ALL のときの並び方です。"],"qhe0tjx":["最初の文ではなく、最後のSELECT文の文末に書きます。","ORDER BY は全体で1回だけ、最後に書きます。","ORDER BY は書けます（最後に1回だけ）。"],"q9o6we6":["和集合は UNION で実現できます。","差集合は MINUS で実現できます。","共通集合は INTERSECT で実現できます。"],"qc8rjyi":["問合せの中に問合せを入れるのは副問い合わせです。","ふつうの SELECT 文は集合演算ではありません。UNION などを使ったものが集合演算です。","表の構成ではなく、SELECT句の列の数とデータ型が一致していればよいです。"],"q12hsdht":["A MINUS B は「Aだけの部分」です。","A UNION B は AとBの全体です。","INTERSECT は重なっている部分です。"],"q1disl0q":["Aだけの部分は A MINUS B です。","Bだけの部分は B MINUS A です。","全体は A UNION B です。"],"q15cqamf":["UNION ALL は重複も含めて表示します。","INTERSECT は両方にある行だけを表示します。","MINUS は左から右を取り除いた行を表示します。"],"qbm74p6":["UNION は重複を1回だけにします。","INTERSECT は両方にある行だけを表示します。","MINUS は左から右を取り除いた行を表示します。"],"qdaayfu":["和集合は UNION です。","共通集合は INTERSECT です。","補集合という集合演算は Oracle にはありません。"],"q1s0hlyj":["重複を除いた全部は UNION です。","Aから Bを取り除くのは A MINUS B です。","Bから Aを取り除くのは B MINUS A です。"],"qmo8dqr":["列名は一致しなくてもかまいません。","違う表どうしでも集合演算できます。"],"qbis916":["それは UNION ALL のときの並び方です。","右側が先になることはありません。","不定ではなく、第1問合せの第1列でソートされます。"],"q18k3zyw":["ORDER BY は全体で1回、最後の文の文末にだけ書けます。","第1の文ではなく、最後の文の文末です。","ORDER BY で並び順を変えられます。"],"q10vbz5b":["INSERT は行を追加する DML です。","MERGE は DML です（追加と更新をまとめて行う）。","SELECT は DML です。"],"q1smd22h":["UPDATE はデータを書きかえる文です。","DELETE は行を消す文です。","SELECT はデータを取り出す文です。"],"q5vcu1u":["0 が入るわけではありません。DEFAULT値、なければ NULL です。","空白が入るわけではありません。NULL は空白とは違います。","エラーにはなりません（NOT NULL 制約の列でなければ）。"],"q17x1o8o":["'NULL' と ' ' で囲むと、NULL という4文字の文字列になってしまいます。","\" \" は文字列ではなく名前を囲む記号なので、エラーになります。","値を空けて書くことはできません。NULL と書きます。"],"q8wg0aj":["列名リストは省略できます。そのときは表定義の順に全部の列の値を書きます。","列数が合わないとエラーになります。残りが NULL になることはありません。"],"qplpeb6":["AND ではなくカンマで区切ります（AND だと条件の意味になってしまいます）。","SET は1回だけ書きます。","この書き方はできません。列 = 値 をカンマで並べます。"],"q1s7x6il":["WHERE がないので、1行目だけでなく全部の行が変わります。","WHERE がなくてもエラーにはなりません。全行が変わります。","WHERE がないと全部の行が対象になります。"],"q16zar7g":["DELETE は行を消すだけで、表の定義は残ります。表ごと消すのは DROP TABLE です。","WHERE がなくてもエラーにはなりません。","WHERE がないと全部の行が消えます。"],"qfu4sbh":["DELETE は行ごと消します。列の値だけ消したいときは UPDATE で NULL にします。","DELETE のあとに * は書きません（DELETE FROM 表名）。","DELETE は DML なのでロールバックできます。"],"qhhujuo":["CREATE は DDL（データ定義言語）です。","GRANT は DCL（データ制御言語）です。"],"q1jt4afp":["DELETE は行を消す文です。","SELECT はデータを取り出す文です。","UPDATE はデータを書きかえる文です。"],"q1wfq2a1":["TO ではなく INTO です。","VALUE ではなく VALUES です（最後に S）。","FROM や SET は INSERT 文では使いません。"],"q1i4mntp":["0 が入るわけではありません。","空白が入るわけではありません。","NOT NULL 制約がなければエラーにはならず、NULL か DEFAULT値が入ります。"],"qevcfrf":["' ' で囲むと NULL という文字列になってしまいます。","\" \" は文字列には使えません。","'' （空の文字列）は Oracle では NULL 扱いになりますが、ふつうは NULL と書きます。"],"q1nsa47g":["列名リストは省略できます。","列数が合わないとエラーになります。残りが NULL になることはありません。"],"q9nmiwq":["VALUES は INSERT 文で使います。UPDATE は SET です。","MODIFY という命令はありません。UPDATE です。","TO ではなく SET です。"],"q2hjl5o":["AND で区切ったり SET を2回書いたりはしません。カンマで区切ります。","Oracle では (JOB, SALARY) = (値, 値) という書き方はできません（副問い合わせのときだけ）。","AND ではなくカンマで区切ります。"],"q12247fg":["DELETE のあとに * は書きません。","DROP は表などのオブジェクトを消す命令で、行は消せません。","DELETE TEST.* という書き方はありません。"],"q1k7s33a":["DELETE は行を消すだけで、表の定義は残ります。","WHERE がないので、全部の行が消えます。","WHERE がなくてもエラーにはなりません。全行が消えます。"],"q14i67mq":["1つのセッションの中では、トランザクションは1つずつです。並行できるのは別々のセッションどうしです。","トランザクションが終わっても、セッション（接続）は続きます。","トランザクションの中に別のトランザクションを入れることはできません。"],"qefhgg5":["SAVEPOINT は戻る位置に目印をつけるだけで、確定はしません。","SAVEPOINT は取り消しもしません。","SAVEPOINT とセッションは関係ありません。"],"qdpoq4k":["ネットワークの切断は異常終了で、ロールバックされます（正常な終了ではありません）。","SAVEPOINT ではトランザクションは終わりません。"],"qm19uir":["異常終了したときは、確定していない変更は取り消されます（コミットはされません）。","セーブポイントまで確定されることもありません。全部取り消されます。","選ぶことはできません。自動でロールバックされます。"],"q1ecx400":["読み取り一貫性のため、実行中のSELECT文には始めた時点のデータが返ります。","エラーにはなりません。","ユーザXが読んでいても、ユーザYのCOMMITは成功します。"],"qxlgc6q":["④の CREATE TABLE（DDL）で、それまでの A・B は自動でコミットされます。","B も④の DDL で自動でコミットされています（SAVEPOINT は関係ありません）。","⑥の ROLLBACK で、まだ確定していない C は取り消されます。"],"q62ntlg":["シングルユーザーは1人だけが使う状態です。","リモート・アクセスは離れた場所から接続することです。","ランダム・アクセスはデータを好きな順番で読む方法のことです。"],"q1mncp88":["コネクションは接続そのものを指す一般的な言葉で、授業では区別する単位を「セッション」と呼びます。","ユニットという単位はありません。","ステータスは状態のことです。"],"q1wu1dlt":["1つ1つの文ではなく、関連する文のまとまりがトランザクションです。","接続してから終了するまでは「セッション」です。","処理の数で決まるものではありません。"],"qi1rysb":["1つのセッションでは並行できません。並行できるのは別のセッションどうしです。","トランザクションが終わってもセッションは続きます。","トランザクションの中に別のトランザクションは入れられません。"],"q1oxjk6n":["CONNECT は接続するコマンドです。","COMMAND という SQL はありません。","ROLLBACK は取り消す SQL です。"],"q4bo908":["SETBACK という SQL はありません。","RESTORE という SQL はありません。","COMMIT は確定する SQL です。"],"q17nk6ua":["ROLLBACK は取り消す SQL です。","COMMIT は確定する SQL です。","POINT という SQL はありません。"],"qa70vqu":["接続不良による切断は異常終了で、ロールバックされます。","SAVEPOINT ではトランザクションは終わりません。"],"qvg6gpo":["異常終了ではコミットされません。取り消されます。","セーブポイントが作られることも、コミットされることもありません。"],"q1o46w24":["読み取り一貫性のため、実行中のSELECT文の結果は途中で変わりません。","COMMIT されても、実行中のSELECT文には始めた時点のデータが返ります。","エラーにはなりません。"],"q9iez1c":["SYSTEMスキーマに入るわけではありません。ユーザごとに同じ名前の自分のスキーマができます。","表は自動では作られません。表は CREATE TABLE で自分で作ります。","Oracle ではユーザを作るとスキーマも自動でできるので、別に作る必要はありません。"],"q192guiv":["VARCHAR は古い型なので使いません。必ず 2 をつけて VARCHAR2 にします。","NUMBER は数値用の型です。文字は入りません。","DATE は日付用の型です。"],"qzxa8cu":["NUMBER( ) の中は「範囲」ではなく桁数です。NUMBER(0, 100) という書き方はしません。","100 は「100桁」という意味になってしまいます。100 は3桁なので NUMBER(3) です。","点数は数値なので、文字型の VARCHAR2 ではなく NUMBER を使います。"],"q1owis8z":["CHAR は固定長の文字型です。日付は DATE 型に入れます。","NUMBER は数値の型です。日付は DATE 型に入れます。","VARCHAR2 は文字の型です。日付として計算や比較ができる DATE 型を使います。"],"q145vphc":["データディクショナリは、データベースの管理情報を持つ表やビュー（USER_TABLES など）のことです。","トランザクションは、まとめて確定・取り消しする処理のかたまりのことです。","セッションは、接続してから切断するまでの一連の処理のことです。"],"qxoudoa":["アカウントは一般的な言葉で、Oracle でオブジェクトの持ち主を表す言葉はスキーマです。","ログオンはデータベースに接続する操作のことです。","グループはオブジェクトの持ち主を表す言葉ではありません。権限をまとめるのはロールです。"],"q805310":["スキーマは「オブジェクトの持ち主」という観点の呼び方です。ログオン・権限の単位として呼ぶとユーザです。","ロールは権限をまとめたグループのことです。","セッションは接続してから切断するまでの一連の処理です。"],"q1ck7ru8":["MAKE TABLE という命令はありません。作るときは CREATE です。","INSERT は行を追加する命令です。表を作るのは CREATE TABLE です。","NEW TABLE という命令はありません。"],"q1lf7dhx":["SYSDATE は今の日付・時刻を返す関数です。DEFAULT SYSDATE のように、DEFAULT と組み合わせて使います。","DESC は表の構造を確認するコマンドです。","DDL は CREATE などのデータ定義言語の分類名です。"],"q1kg1sux":["DELETE は行を消す DML です。表の定義は消せません。DELETE TABLE という書き方もありません。","TRUNCATE はデータだけを消して、表の定義（構造）は残します。","UPDATE はデータを書きかえる命令です。"],"qzcotj7":["SHOW は SQL*Plus の設定などを表示するコマンドで、表の構造を見るものではありません。","LIST は SQL*Plus で直前のSQLを表示するコマンドです。","VIEW はビュー（SELECT文に名前をつけたもの）のことです。"],"qn1luvm":["VARCHAR は古い型なので使いません。必ず VARCHAR2 にします。","NUMBER は数値の型です。名前などの文字は入りません。","DATE は日付の型です。"],"qclpmtx":["( ) の中は範囲ではなく桁数です。NUMBER(0, 100) とは書きません。","NUMBER(100) は100桁という意味です。100 は3桁なので NUMBER(3) です。","点数は数値なので NUMBER を使います。"],"q1krg3vb":["NUMBER は数値の型です。日付は DATE 型に入れます。","CHAR は固定長の文字型です。","VARCHAR2 は文字の型です。日付は DATE 型に入れます。"],"q1n7t41v":["2000バイトは CHAR（固定長）の最大です。VARCHAR2 は4000バイトです。","128バイトはオブジェクト名（表名など）の長さの上限です。","255バイトは Oracle の VARCHAR2 の最大ではありません。"],"q5zufx0":["6 は「整数部」ではなく「全体」の桁数です。整数部は 6 − 2 = 4桁です。","バイトではなく、10進数の「桁数」です。","範囲ではありません。1つ目が全体の桁数、2つ目が小数部の桁数です。"],"qiqod41":["10000 は5桁なので、4桁までの NUMBER(4) には入りません。","12345 は5桁なので入りません。","100000 は6桁なので入りません。"],"q1apttz9":["整数になるのは NUMBER(p) のように桁数だけ指定したときです。","固定小数点数になるのは NUMBER(p, s) のように桁数を指定したときです。","NUMBER は数値の型です。文字列にはなりません。"],"qsttatc":["DATA（データ）ではなく DATE（デート）です。DATA という型はありません。","DAY という型はありません。","TIME という型は Oracle にはありません。日付と時刻は DATE 型にまとめて入ります。"],"q9m6gvx":["データだけ消して構造を残すのは TRUNCATE TABLE です。","DROP TABLE は DDL なので ROLLBACK では戻せません。","特定の行を選んで消すのは DELETE 文（WHERE句つき）です。"],"q70ok0f":["DROP は DDL なのでロールバックできません。","TRUNCATE は DDL なのでロールバックできません。"],"qelkt4z":["123.45 は全体5桁・小数部2桁なので保存できます。","999.99 は NUMBER(5, 2) の最大値なので保存できます。","0.5 は整数部1桁・小数部1桁なので保存できます。"],"q1uvsbu2":["最初の文字に数字は使えません。英字で始めます。","SELECT などの予約語は、表名や列名には使えません。","表名などの大文字・小文字は区別されません（emp と EMP は同じ表）。"],"q1e9403g":["コピーされる制約は NOT NULL だけです。主キーや外部キーなどは引き継がれません。","PRIMARY KEY は引き継がれません。引き継がれるのは NOT NULL だけです。","NOT NULL 制約だけは引き継がれます。"],"qtrk740":["CREATE TABLE はひとかたまりです。表名は TABLE のあとに書きます。","列の定義は ( ) で囲む必要があります。","学生番号は文字型なので VARCHAR2、点数は整数なので NUMBER です。逆になっています。"],"qtxu41q":["VARCHAR2 は可変長の文字型で、最大4000バイトです。","CLOB は長い文字データ（大容量）用の型で、固定長2000バイトの型ではありません。","STRING という型は Oracle にはありません。"],"qa2qjfh":["CHARVAR という型はありません。","CHAR は固定長で、最大2000バイトです。","VARCHAR は古い型で、使わないことになっています。"],"q17tex7n":["バイトや2進数ではなく、10進数の「桁数」です。","6 は整数部ではなく「全体」の桁数です。","整数部ではなく全体の桁数で、単位もバイトではなく10進数の桁です。"],"q1k75g5k":["NUMBER(4) は小数部の桁数が0なので、10.7 は 11 に丸められます。そのままの値では保存できません。","10000 は5桁なので、4桁までの NUMBER(4) には入りません。"],"q12o18jp":["固定小数点数になるのは NUMBER(p, s) のときです。","整数になるのは NUMBER(p) のときです。","NUMBER は数値の型です。"],"q1u17zyg":["DATA ではなく DATE です。DATA という型はありません。","DAY という型はありません。","TIMESTAMP は秒より細かい時刻まで持てる別の型で、7バイト固定の DATE とは違います。"],"q99gv7c":["構造を残してデータだけ消すのは TRUNCATE です。","DROP は DDL なので ROLLBACK では戻せません。","特定の行を選んで消すのは DELETE（WHERE句つき）です。"],"q1oqf9kc":["DELETE も全行消せますが、ゆっくりでロールバックできる DML です。高速に消すのは TRUNCATE です。","DROP は表の構造ごと消します。","UPDATE はデータを書きかえる命令です。"],"q15b0wf3":["DROP は DDL なのでロールバックできません。","TRUNCATE は DDL なのでロールバックできません。"],"q1t9kbu8":["検索を速くするのは索引（INDEX）の役目です。制約ではありません。","制約で容量は節約できません。","制約は使いやすさのためではなく、まちがったデータを入れないためのものです。"],"q15zeydo":["FOREIGN KEY は、データとデータの関係を守る「参照整合性制約」です。","DEFAULT は既定値を入れるオプションで、制約ではありません。"],"q1a2tkc":["主キーには NULL は入れられません。"],"qnmfxx4":["それは PRIMARY KEY の説明です。UNIQUE は NULL があってもよく、表に何個でもつけられます。","NULL を許さないのは NOT NULL 制約です。UNIQUE は重複を許さない制約です。","自由な条件をつけられるのは CHECK 制約です。"],"q121a6ng":["UNIQUE は重複を許さないだけで、NULL は入れられます。","CHECK は条件をつける制約で、NULL のときは条件チェックをすり抜けます。NULL 禁止は NOT NULL です。"],"q1gk5nqt":["NULL を入れて出るのは NOT NULL 制約のエラー（ORA-01400）です。","条件に合わないデータで出るのは CHECK 制約のエラー（ORA-02290）です。","権限がないときは「権限が不足しています」などの別のエラーです。"],"q4xnnri":["検索を速くするのは索引（INDEX）です。","制約で容量は節約できません。","制約は操作性のためではなく、データの整合性を保つためのものです。"],"qkqom4w":["FOREIGN KEY はデータとデータの関係を守る参照整合性制約です。","DEFAULT は既定値を入れるオプションで、制約ではありません。"],"q14u2k8s":["列のデータ単体についての制約は「エンティティ整合性制約」です。","行を一意に特定する制約は PRIMARY KEY です。","自由な条件で制約をかけるのは CHECK 制約です。"],"qc3flhb":["主キーには NULL は入れられません。","値が入力されないときに既定値を入れるのは DEFAULT で、制約ではありません。"],"q12346cs":["UNIQUE は NULL を許します。また、UNIQUE も同じ値は許しません。","UNIQUE は表に何個でもつけられます。1つだけなのは PRIMARY KEY です。"],"qo5rqpr":["UNIQUE は重複を許さないだけで、NULL は入れられます。","CHECK は条件をつける制約です。NULL を禁止するのは NOT NULL です。"],"q170msp1":["UNIQUE は重複を許さない制約です。条件はつけられません。","NOT NULL は NULL を許さないだけの制約です。","PRIMARY KEY は重複も NULL も許さない主キーの制約です。"],"qok9vte":["NULL を入れたときは NOT NULL 制約のエラー（ORA-01400）です。","条件に合わないときは CHECK 制約のエラー（ORA-02290）です。","一意制約のエラーは権限とは関係ありません。"],"qv6b7q3":["表レベルは、列の定義をすべて書いた後にまとめて制約を書く方法です。","「行レベル」という制約の定義方法はありません。","「スキーマレベル」という制約の定義方法はありません。"],"q1r480d8":["COLUMN は列のことで、制約名をつけるキーワードではありません。","DEFAULT は既定値を指定するキーワードです。","KEY だけでは制約名はつけられません。CONSTRAINT 制約名 と書きます。"],"q10mkl4w":["NOT NULL だけでは重複を防げないので、親キーとして行を特定できません。","FOREIGN KEY は子表（参照する側）の列につける制約です。"],"q1guczfq":["子表の外部キーは親表の親キー列を参照するので、親表がないと子表は作れません。","参照される親表が先にないと、参照整合性制約を定義できません。","同時に作る必要はありません。親表 → 子表の順に作ります。"],"q9zgxrb":["子表から参照されている間は、親表は削除できません（CASCADE CONSTRAINTS をつければ可能）。","順番があります。子表から先に削除します。","子表から順に削除すれば、どちらも削除できます。"],"q1sret3u":["外部キー列には NULL を入れられます（NOT NULL をつけない限り）。","逆です。親キー列にない値を、外部キー列に入れられません。"],"qlm9www":["参照している外部キーがなければ、親キーの値は自由に削除・変更できます。","参照されている値は変更もできません。","参照されている値は削除もできません（ON DELETE CASCADE などをつけない限り）。"],"qsiuh17":["列レベルでは FOREIGN KEY は書かず、REFERENCES 親表(親キー列) と書きます。参照先も書かれていません。","外部キーは Email表の mno です。参照する側と参照される側が逆になっています。","参照先は Friends.fno ではなく、Friends(fno) のように ( ) で書きます。"],"q401l0t":["子表の外部キーが NULL になるのは ON DELETE SET NULL のときです。","ON DELETE CASCADE をつけると、エラーにならず子表の行もいっしょに削除されます。","ON DELETE CASCADE をつけると、子表の行も削除されます。"],"qcvqnaw":["WITH CHECK OPTION は、ビューで WHERE句に合わない変更を防ぐオプションです。","FORCE は、元表がなくてもビューを作るオプションです。","ON DELETE SET NULL は、親の行を消したときに子の外部キーを NULL にする指定で、表の削除とは関係ありません。"],"qpcaf74":["一意制約（UNIQUE）は重複を許さない制約です。","エンティティ整合性制約は列のデータ単体についての制約です。他表の値を参照するのは参照整合性制約です。","「削除制約」という制約はありません。"],"q1vuswmx":["emp表は dept表を参照する側なので子表です。","参照される側（dept表）だけが親表です。","参照される dept表が親表です。"],"q17gipat":["NOT NULL だけでは重複を防げません。","FOREIGN KEY は子表の外部キー列につける制約です。"],"qklr44z":["親キーは参照される側（商品表の ID 列）です。","主キーはその表で行を特定する列です。参照する列は外部キーです。","一意キー（UNIQUE）は重複を許さない列のことです。"],"q3axy5s":["子表は親表を参照するので、親表がないと作れません。","順番があります。親表から作ります。"],"qlvut3e":["子表から参照されている間は、親表は削除できません。","順番があります。子表から削除します。"],"q1w7qgxu":["逆です。親キー列にない値を、外部キー列に入れられません。","外部キー列には NULL を入れられます（NOT NULL をつけない限り）。"],"q1xyeo3j":["INSERT できない値（親キーにない値）は、UPDATE でもその値に変えられません。","参照されていて DELETE できない値は、別の値に変更することもできません。","参照している外部キーがなければ、親キーの値は自由に削除・変更できます。"],"q1s7yalv":["列レベルでは FOREIGN KEY は書かず、REFERENCES 親表(親キー列) と書きます。","外部キーは Email表の mno です。参照する側とされる側が逆です。","参照先は Friends(fno) のように ( ) で書きます。Friends.fno とは書きません。"],"qgl1nvv":["Students は親表の名前です。","sno は親表 Students の親キー列です。","NUMBER はデータ型です。"],"q19ulnp":["制約は ( ) の中に書きます。) を閉じたあとには書けません。","制約と制約の間はスペースではなくカンマで区切ります。"],"qn6kt2h":["UNIQUE は一意制約です。主キーは PRIMARY KEY です。","CHECK は条件の制約です。主キーにはなりません。","表レベルでは、どの列が主キーかを PRIMARY KEY (sid) のように ( ) で書く必要があります。"],"qzlcxth":["NOT NULL は列レベルでしか定義できません。","1つの列だけの UNIQUE は、列レベルでも表レベルでも定義できます。"],"qf5iwl2":["逆です。NOT NULL は列レベルでしか定義できません。","NOT NULL にも CONSTRAINT 制約名 で名前をつけられます。","DEFAULT が先、NOT NULL が後です。"],"q1m1b3yu":["DEFAULT を先に、NOT NULL を後に書きます。","データ型は列名のすぐ後に書きます。","NOT NULL のあとにカンマを打つと、DEFAULT が別の定義になってしまいエラーです。"],"q1rndx00":["& では区切りません。列名はカンマで区切ります。","( ) は1つにまとめて、中でカンマ区切りにします。","PRIMARY KEY は表に1つしかつけられません。2列の組み合わせなら1つの ( ) の中に並べます。"],"q9p9mn3":["PRIMARY KEY は主キーの制約です。","UNIQ

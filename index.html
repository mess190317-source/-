const tKey=t=>/^'/.test(t)?t:t.toUpperCase();
function lcsDiff(a,b){
  /* a=自分, b=正解 のトークン列。同じ部分・余計な部分・足りない部分に分ける */
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=tKey(a[i])===tKey(b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const mine=[],ans=[];let i=0,j=0;
  while(i<n&&j<m){if(tKey(a[i])===tKey(b[j])){mine.push([a[i],0]);ans.push([b[j],0]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){mine.push([a[i],1]);i++}else{ans.push([b[j],1]);j++}}
  while(i<n)mine.push([a[i++],1]);while(j<m)ans.push([b[j++],1]);
  return {mine,ans,same:dp[0][0]};
}
function edit(a,b){a=a.toUpperCase();b=b.toUpperCase();const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

  /* つづりまちがい */
  const extra=diff.mine.filter(x=>x[1]).map(x=>x[0]).filter(t=>/^[A-Za-z_][A-Za-z0-9_]*$/.test(t));
  const miss=diff.ans.filter(x=>x[1]).map(x=>x[0]).filter(t=>/^[A-Za-z_][A-Za-z0-9_]*$/.test(t));
  extra.forEach(t=>{const near=miss.find(m=>m.length>2&&edit(t,m)<=2&&t.toUpperCase()!==m.toUpperCase());if(near)H.push(`「${t}」は「${near}」のつづりまちがいかもしれません。`)});
  return [...new Set(H)];
}
function whyHTML(q,cur){
  if(cur.ok||cur.skipped)return '';
  /* 4択：選んだ答えを表示。ノートの要点問題なら、どの要点の説明かも */
  if(q.t==='c'){
    const picked=[...cur.sel].filter(x=>x>=q.n);if(!picked.length)return '';
    let reason='';
    if(q.k==='p'){const pts=NOTES[q.l]||[];reason=picked.map(oi=>{const hit=pts.find(p=>p[1]===q.o[oi]);return hit?`あなたが選んだのは【${esc(hit[0])}】の説明です。`:''}).filter(Boolean).join('<br>');
      if(reason)reason+=`<br>この問題は【${esc(pts[q.pi][0])}】についての問題です。`}
    if(q.n>1){const okPicked=[...cur.sel].filter(x=>x<q.n).length;reason=(reason?reason+'<br>':'')+`正しいものは ${q.n}つで、あなたは ${okPicked}つ当たっていました。`}
    const ws=WHY[q.id]||[];
    return `<div class="why"><span class="label">あなたが選んだ答え</span>${picked.map(oi=>`<div class="pick">${optHTML(q.o[oi])}${ws[oi-q.n]?`<p class="why-x"><b>なぜ違う？</b>${esc(ws[oi-q.n])}</p>`:''}</div>`).join('')}${reason?`<p class="why-r">${reason}</p>`:''}</div>`;
  }
  const given=(cur.given||'').trim();if(!given)return '';
  if(q.t==='w'){
    const f=normW,best=q.a.slice().sort((x,y)=>edit(f(given),f(x))-edit(f(given),f(y)))[0];
    const d=edit(f(given),f(best));
    const note=d<=2&&f(best).length>3?'<p class="why-r"><b>おしい！</b> つづりが少し違います。</p>':'';
    const df=lcsDiff([...given.normalize('NFKC')],[...best.normalize('NFKC')]);
    return `<div class="why"><span class="label">どこが違う？</span><div class="cmp"><div><span class="small muted">あなた</span><code class="wd">${df.mine.map(([c,x])=>x?`<mark class="ex">${esc(c)}</mark>`:esc(c)).join('')}</code></div><div><span class="small muted">正解</span><code class="wd">${df.ans.map(([c,x])=>x?`<mark class="ms">${esc(c)}</mark>`:esc(c)).join('')}</code></div></div>${note}</div>`;
  }
  /* SQL：いちばん近い模範解答と比べる */
  const gt=sqlTok(given).filter(t=>t!==';');
  const cand=q.a.map(a=>{const d=lcsDiff(gt,sqlTok(a).filter(t=>t!==';'));return {a,d}}).sort((x,y)=>y.d.same-x.d.same)[0];
  const hints=sqlHints(given,cand.a,cand.d);
  return `<div class="why"><span class="label">どこが違う？</span>
    <p class="small muted"><mark class="ex">赤</mark>＝あなたの答えにあって正解にないもの　<mark class="ms">緑</mark>＝正解にあって、あなたの答えにないもの</p>
    <div class="cmp"><div><span class="small muted">あなた</span><div class="code tk">${tokHTML(cand.d.mine,'ex')||'（なし）'}</div></div>
    <div><span class="small muted">正解</span><div class="code tk">${tokHTML(cand.d.ans,'ms')}</div></div></div>
    ${hints.length?`<span class="label" style="margin-top:4px">ここに注意</span><ul class="why-h">${hints.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:''}</div>`;
}
function feedback(q,cur){
  const ok=cur.ok;
  return `<div class="fb ${ok?'ok':'ng'}" role="status">
    <div class="verdict"><span class="mark">${ok?'○':'×'}</span>${ok?(cur.over?'正解にしました':'正解！'):(cur.skipped?'答えを確認しよう':'不正解')}</div>
    ${ok&&q.t==='c'?'':`<div><span class="label">正解</span>${answerText(q)}</div>`}
    ${whyHTML(q,cur)}
    <p>${br(q.e)}</p>
    <span class="src">出典：${srcLabel(q)}</span>
    ${q.k==='g'?`<pre class="code">${esc(gById(q.gid).ex)}</pre>`:''}
    ${!ok&&q.t==='d'&&!cur.skipped?`<p class="small muted">書き方が少し違うだけ（列の順番、制約名をつけた など）なら、下の「自分の答えも正解」で正解にできます。</p>`:''}
  </div>`;
}
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||!Z||!Z.cur||document.querySelector('.ov'))return;
  const q=Z.list[Z.i];
  if(Z.cur.done&&e.key==='Enter'&&document.activeElement?.id!=='ov'){e.preventDefault();next();return}
  if(!Z.cur.done&&q.t==='c'&&q.n===1&&/^[1-6]$/.test(e.key)){const j=+e.key-1;if(j<Z.cur.order.length){const oi=Z.cur.order[j];Z.cur.sel=new Set([oi]);judge(oi<q.n)}}
});

/* ===== 結果 ===== */
function renderResult(){
  if(!Z){go('home',{replace:true});return}
  const res=Z.res.filter(Boolean),ok=res.filter(r=>r.ok).length,n=res.length,pct=n?Math.round(ok/n*100):0;
  const by={};res.forEach(r=>{const b=by[r.q.c]||(by[r.q.c]={ok:0,n:0});b.n++;if(r.ok)b.ok++});
  const wrong=res.filter(r=>!r.ok),ctx=Z.ctx;
  if(!Z.played){rkPush().catch(()=>{});Z.played=1;const fin=Z.ctx&&!lessonProg(Z.ctx.l).next;setTimeout(()=>sfx(fin||pct>=90?'done':pct>=60?'good':'soft'),150)}
  const msg=pct>=90?'すばらしい！':pct>=70?'いい調子！':pct>=50?'あと少し！':'間違えたところを見直そう';
  const C=2*Math.PI*42;
  let main='';
  if(ctx){const p=lessonProg(ctx.l);
    if(p.next){const same=p.next.id===ctx.step;main=`<button class="btn primary big" id="nx">${same?'この続きをやる':`次のステップへ：${p.next.name}`} ›</button>`}
    else{const nl=LESSONS[LESSONS.indexOf(ctx.l)+1];main=`<div class="donebox">✓ ${lname(ctx.l)}は全ステップ完了！</div>${nl!=null?`<button class="btn primary big" id="nl">次の回へ：${lname(nl)} ${LT[nl]} ›</button>`:''}`}}
  app.innerHTML=`
  <section class="card" style="display:flex;flex-direction:column;gap:16px">
    <span class="label">${esc(Z.title)}${n<Z.list.length?`（${Z.list.length}問中 ${n}問で終了）`:''}</span>
    <div class="score">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/><text x="50" y="58" text-anchor="middle">${pct}%</text></svg>
      <div class="msg"><b>${msg}</b><span class="muted"><b class="num" style="font-size:18px;color:var(--ink)">${ok}</b> / ${n} 問正解</span></div>
    </div>
    ${main}
    <div class="rbtns2">${wrong.length?`<button class="btn ${main?'':'primary'}" id="again">間違えた ${wrong.length}問をやり直す</button>`:''}<button class="btn" id="home">ホームへ</button></div>
  </section>
  ${Object.keys(by).length>1?`<section class="card"><h2 style="margin-bottom:12px">分野ごと</h2><div class="catrows">${Object.entries(by).map(([c,b])=>`<div class="catrow"><span>${catName(+c)}</span><div class="bar2"><i style="width:${b.ok/b.n*100}%"></i></div><span class="small muted num">${b.ok} / ${b.n}</span></div>`).join('')}</div></section>`:''}
  ${wrong.length?`<section class="card"><h2 style="margin-bottom:12px">間違えた問題の答え</h2><ol class="wronglist">${wrong.map(r=>`<li>
    <span class="small muted">${catName(r.q.c)}・${srcLabel(r.q)}</span>
    <div class="qtext small-q">${qHTML(r.q.q)}</div>${r.q.code?`<pre class="code">${esc(r.q.code).replace(/___/g,'<span class="blank">？</span>')}</pre>`:''}
    ${r.given&&r.q.t!=='c'?`<div class="small">あなたの答え</div><pre class="code">${esc(r.q.t==='d'?fmtSQL(r.given):r.given)}</pre>`:''}
    <div><span class="label">正解 </span>${answerText(r.q)}</div></li>`).join('')}</ol></section>`:''}`;
  const $=id=>document.getElementById(id);
  if($('nx'))$('nx').onclick=()=>startStep(ctx.l,lessonProg(ctx.l).next.id);
  if($('nl'))$('nl').onclick=()=>go('lesson',{l:LESSONS[LESSONS.indexOf(ctx.l)+1]});
  if($('again'))$('again').onclick=()=>startQuiz(shuffle(wrong.map(r=>r.q)),'間違えた問題',{ctx});
  $('home').onclick=()=>go('home');
}

render();
bxRun();
setTimeout(hideSplash,450);
if(!S.intro)showIntro(0);
else{let up='';try{up=sessionStorage.getItem('db3upd')||''}catch(e){}
  if(up===APP_VER){try{sessionStorage.removeItem('db3upd')}catch(e){}if(unreadNews())setTimeout(()=>toast('最新版に更新しました','内容を見る',showNews),700)}
  else if(unreadNews())setTimeout(()=>toast('新しいお知らせがあります','見る',showNews),900)}
checkUpdate();
